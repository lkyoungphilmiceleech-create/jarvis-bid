<title>국내외 협업사 DB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* 관제실(pmo.tpl.html)과 같은 색·글꼴 */
:root{
  color-scheme:dark;
  --bg:#060C13;--bg2:#0A1622;--glass:rgba(16,34,50,.72);--glass2:rgba(22,46,66,.55);--ink:#DDF3FA;--muted:#7F9CAB;--line:rgba(88,200,235,.22);
  --holo:#38D5F0;--holo-ink:#04121A;--holo-soft:rgba(56,213,240,.14);--amber:#F5B942;--go:#4BE3A0;--stop:#FF7A7A;--grid:rgba(56,213,240,.07);
  --hud:"Chakra Petch","IBM Plex Sans KR",ui-monospace,monospace;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#E4ECF1;--bg2:#D6E2EA;--glass:rgba(255,255,255,.8);--glass2:rgba(240,247,250,.9);--ink:#0E2230;--muted:#557080;--line:rgba(10,110,140,.22);
  --holo:#0A7FA0;--holo-ink:#FFFFFF;--holo-soft:rgba(10,127,160,.1);--amber:#A56A06;--go:#127A4E;--stop:#B3332B;--grid:rgba(10,127,160,.08);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#E4ECF1;--bg2:#D6E2EA;--glass:rgba(255,255,255,.8);--glass2:rgba(240,247,250,.9);--ink:#0E2230;--muted:#557080;--line:rgba(10,110,140,.22);
  --holo:#0A7FA0;--holo-ink:#FFFFFF;--holo-soft:rgba(10,127,160,.1);--amber:#A56A06;--go:#127A4E;--stop:#B3332B;--grid:rgba(10,127,160,.08);}}
body{color:var(--ink);font:15px/1.6 var(--sans);padding-inline:16px;padding-block:16px 56px;min-height:100%;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px,radial-gradient(1200px 600px at 30% 0%,var(--bg2),var(--bg)) fixed,var(--bg)}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hudlabel{font:500 11px var(--hud);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px}
.bar .where{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.live{width:8px;height:8px;border-radius:50%;background:var(--go);box-shadow:0 0 10px var(--go);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.clock{font:700 15px var(--hud);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);font:500 12px var(--sans);padding:5px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--holo);color:var(--holo-ink)}
.btn{font:500 13px var(--sans);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:5px 12px;cursor:pointer;white-space:nowrap;transition:border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--holo);box-shadow:0 0 12px var(--holo-soft)}
.btn.primary{background:var(--go);color:var(--holo-ink);border-color:var(--go)}
.btn.x{color:var(--muted)}
.btn.x:hover{color:var(--stop);border-color:var(--stop)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
.note{font-size:12px;color:var(--muted);margin:0}
@keyframes bob{50%{transform:translateY(-4px)}}
.hero{display:flex;gap:16px;align-items:center;padding:16px 18px;flex-wrap:wrap}
.hero img{width:72px;height:72px;animation:bob 4s ease-in-out infinite}
.hero h1{margin:0;font:700 22px/1.3 var(--sans);color:var(--holo);overflow-wrap:anywhere}
.hero>div{flex:1;min-width:0}
.panel{padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font:700 16px var(--sans)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,textarea{font:14px var(--sans);color:var(--ink);background:var(--glass2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;box-sizing:border-box}
textarea{min-height:52px;resize:vertical;width:100%}
input:focus,textarea:focus{outline:0;border-color:var(--holo);box-shadow:0 0 12px var(--holo-soft)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:500 11px var(--hud);letter-spacing:.04em;color:var(--muted);background:var(--glass2);white-space:nowrap}
tbody tr:hover{background:var(--holo-soft)}
.bt td input{width:100%;min-width:90px;padding:3px 6px;font-size:12px}
select{font:14px var(--sans);color:var(--ink);background:var(--glass2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;max-width:100%}
a{color:var(--holo)}
.empty{font-size:13px;color:var(--muted);padding:6px 0}
.ext{border:1px solid var(--holo);border-radius:12px;padding:10px 12px;background:var(--holo-soft);font-size:13px;margin:6px 0 0}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11px;color:var(--muted);white-space:nowrap}
tbody tr.click{cursor:pointer}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form .wide{grid-column:1/-1}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg2);color:var(--ink);max-width:760px;width:calc(100% - 32px);padding:18px;box-sizing:border-box}
dialog::backdrop{background:rgba(0,0,0,.55)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);transition:border-color .2s,background .2s}
.drop.on{border-color:var(--holo);background:var(--holo-soft);color:var(--ink)}
body.staff .adm{display:none!important} /* 공유받은 PM: 내려받기 숨김 — 실제 차단은 downloads 권한 */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>

// 엑셀 머리글 → 칸 (앞 항목이 먼저 가져간다: '휴대전화'는 모바일, '회사명'은 기업명)
const HM = [["모바일", /모바일|휴대|핸드폰|^hp$|mobile|cell/], ["이메일", /이메일|email|메일/], ["대표번호", /대표번호|대표전화|전화|tel|phone|연락처/], ["웹", /^웹|홈페이지|website|url/],
  ["기업명", /기업|회사|업체|상호|company|파트너/], ["국가", /국가|country/], ["도시", /도시|city/], ["분야", /분야|업종|category|field/], ["사업", /사업|프로젝트|project/], ["연도", /연도|년도|year/],
  ["역할", /역할|role/], ["평가", /평가|rating/], ["담당자", /담당|성명|이름|name|contact/], ["직책", /직책|직위|직급|title|position/], ["메모", /메모|비고|memo|note/]];
const hmap = row => { const h = row.map(nk), m = {}, used = new Set(); HM.forEach(([k, re]) => { const j = h.findIndex((x, i) => x && !used.has(i) && re.test(x)); if (j >= 0) { m[k] = j; used.add(j); } }); return m; };
function fromAoa(aoa, pos) { // 앞 5줄 안에 머리글이 있으면 열 이름으로, 없으면 pos 순서로(pos 없으면 null)
  const hi = aoa.slice(0, 5).findIndex(r => Object.keys(hmap(r)).length >= 2 && r.every(c => String(c).length <= 20 && !/@|\d{3}/.test(c))); // 메일·전화가 든 줄은 머리글 아님
  const m = hi >= 0 ? hmap(aoa[hi]) : pos && Object.fromEntries(pos.map((k, i) => [k, i])); if (!m) return null;
  return aoa.slice(hi + 1).map(r => Object.fromEntries(Object.entries(m).map(([k, j]) => [k, String(r[j] ?? "").trim()]))).filter(o => Object.values(o).some(Boolean));
}
const aoaOf = async f => { if (!window.XLSX) throw new Error("엑셀 읽기 도구를 불러오지 못했습니다."); return Object.values(readBook(XLSX.read(await f.arrayBuffer(), {type: "array"})))[0] || []; };
const okMail = v => /^[^\s@"<>]+@[^\s@"<>]+\.[^\s@"<>]+$/.test(v), okTel = v => /^\+?[\d\s\-().]{7,20}$/.test(v);
const telA = v => v ? (okTel(v) ? `<a href="tel:${esc(v.replace(/[^\d+]/g, ""))}">${esc(v)}</a>` : esc(v)) : "";
const mailA = v => v ? (okMail(v) ? `<a href="mailto:${esc(v)}">${esc(v)}</a>` : esc(v)) : "";
const webA = v => /^https?:\/\/\S+$/i.test(v || "") ? `<a href="${esc(v)}" target="_blank" rel="noopener noreferrer">${esc(v.replace(/^https?:\/\//i, ""))}</a>` : esc(v);
const byYear = (a, b) => String(b.연도 || "").localeCompare(String(a.연도 || ""));
const hist = x => [...(x.이력 || [])].sort(byYear);
let db = null, downloads = null, admin = false, partners = [], pf = {q: "", 국가: "", 분야: ""}, ptDraft = null;
function drawPt() {
  if (!$("ptBox")) return;
  $("ptC").innerHTML = opt([...new Set(partners.map(x => x.국가).filter(Boolean))].sort(), pf.국가, "국가 전체");
  $("ptF").innerHTML = opt([...new Set([...FIELD, ...partners.map(x => x.분야).filter(Boolean)])], pf.분야, "분야 전체");
  const q = pf.q.toLowerCase(), ps = partners.filter(x => (!q || [x.회사명, x.담당자].some(v => String(v || "").toLowerCase().includes(q))) && (!pf.국가 || x.국가 === pf.국가) && (!pf.분야 || x.분야 === pf.분야))
    .sort((a, b) => String(a.회사명).localeCompare(String(b.회사명), "ko"));
  $("ptBox").innerHTML = `<div class="tw"><table><thead><tr><th>회사명</th><th>국가·도시</th><th>분야</th><th>담당자</th><th>연락처</th><th>협업 이력</th></tr></thead><tbody>${ps.map(x => { const h = hist(x);
    return `<tr class="click" data-pt="${esc(x.id)}"><td><b>${esc(x.회사명)}</b>${x.웹 ? `<br>${webA(x.웹)}` : ""}</td><td>${esc([x.국가, x.도시].filter(Boolean).join(" · "))}</td><td>${x.분야 ? `<span class="tag">${esc(x.분야)}</span>` : ""}</td><td>${esc(x.담당자)}${x.직책 ? ` <span class="note">${esc(x.직책)}</span>` : ""}</td><td>${[telA(x.모바일), mailA(x.이메일), telA(x.대표번호)].filter(Boolean).join("<br>")}</td><td>${h.length ? `이력 ${h.length}건${h[0].연도 ? ` · 최근 ${esc(h[0].연도)}` : ""}` : '<span class="note">없음</span>'}</td></tr>`; }).join("")
    || `<tr><td colspan="6" class="empty">${partners.length ? "조건에 맞는 협업사가 없습니다." : "등록된 협업사가 없습니다."}</td></tr>`}</tbody></table></div>`;
}
function drawHist() { $("hBox").innerHTML = `<div class="tw"><table class="bt"><thead><tr>${HI.map(k => `<th>${k}</th>`).join("")}<th></th></tr></thead><tbody>${ptDraft.이력.map((h, i) => `<tr>${HI.map(k => `<td><input data-hi="${i}|${k}" aria-label="${k}" value="${esc(h[k])}"${k === "연도" ? ' inputmode="numeric" placeholder="2026"' : k === "평가" ? ' placeholder="예) 우수, 재협업 추천"' : ""}></td>`).join("")}<td><button class="btn x" type="button" data-hdel="${i}" aria-label="이력 삭제">✕</button></td></tr>`).join("") || '<tr><td colspan="5" class="empty">협업 이력이 없습니다.</td></tr>'}</tbody></table></div>`; }
function editPt(x) {
  const isNew = !x; ptDraft = {...x, 이력: hist(x || {}).map(h => ({...h}))};
  const f = (k, extra = "") => `<label>${k}<input data-rf="${k}" value="${esc(ptDraft[k])}"${extra}></label>`;
  $("dlgForm").innerHTML = `<h2 style="margin:0 0 10px">${isNew ? "협업사 추가" : esc(x.회사명)}</h2><div class="form">${f("회사명")}${f("국가", ' list="ptCs"')}${f("도시")}${f("분야", ' list="ptFs" placeholder="고르거나 직접 입력"')}${f("담당자")}${f("직책")}${f("모바일", ' type="tel"')}${f("이메일", ' type="email"')}${f("대표번호", ' type="tel"')}${f("웹", ' type="url" placeholder="https://"')}<label class="wide">메모<textarea data-rf="메모">${esc(ptDraft.메모)}</textarea></label></div>
    <datalist id="ptCs">${opt([...new Set(partners.map(p => p.국가).filter(Boolean))])}</datalist><datalist id="ptFs">${opt(FIELD)}</datalist>
    <div class="row" style="margin-top:12px"><h2>협업 이력</h2><span style="flex:1"></span><button class="btn" type="button" id="hAdd">+ 이력 추가</button></div><div id="hBox"></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" value="save">저장</button>${isNew ? "" : '<button class="btn x" value="del">삭제</button>'}<button class="btn" value="cancel">닫기</button></div>`;
  drawHist();
  $("dlg").onclose = async () => { const v = $("dlg").returnValue; if (!v || v === "cancel" || !db) return;
    if (v === "del") { if (confirm(`'${x.회사명}' 협업사를 삭제할까요? 협업 이력도 함께 지워집니다.`)) await db.doc(`partners/${x.id}`).delete().catch(() => alert("삭제하지 못했습니다.")); return; }
    const n = {}; $("dlgForm").querySelectorAll("[data-rf]").forEach(el => n[el.dataset.rf] = el.value.trim());
    if (!n.회사명) { alert("회사명을 넣어 주세요."); $("dlg").returnValue = ""; $("dlg").showModal(); return; }
    n.이력 = ptDraft.이력.map(h => Object.fromEntries(HI.map(k => [k, String(h[k] ?? "").trim()]))).filter(h => HI.some(k => h[k])).sort(byYear); n.updatedAt = new Date().toISOString();
    try { if (isNew) await db.collection("partners").add(n); else await db.doc(`partners/${x.id}`).set(n); if ((n.이메일 && !okMail(n.이메일)) || [n.모바일, n.대표번호].some(v => v && !okTel(v))) alert("저장했습니다. 이메일·전화 형식을 한 번 확인해 주세요."); }
    catch { alert("저장하지 못했습니다."); } };
  $("dlg").returnValue = ""; $("dlg").showModal();
}
// 협업사 엑셀: 머리글 필수. 회사명+국가가 같으면 한 곳으로 합치고(빈 칸만 채움) 이력은 이어 붙인다
async function ptImport(aoa) {
  const got = fromAoa(aoa); if (!got) { alert("첫 줄(머리글)에 회사명·국가·담당자 같은 열 이름이 있어야 합니다."); return; }
  const key = o => nk(o.회사명) + "|" + nk(o.국가), by = new Map(partners.map(x => [key(x), {...x, 이력: [...(x.이력 || [])]}])), touched = new Set();
  got.forEach(o => { o.회사명 = o.기업명; if (!o.회사명) return; const k = key(o), x = by.get(k) || {이력: []}, h = Object.fromEntries(HI.map(f => [f, o[f] || ""]));
    PT.forEach(f => { if (o[f] && !x[f]) x[f] = o[f]; }); if (HI.some(f => h[f]) && !x.이력.some(y => HI.every(f => (y[f] || "") === h[f]))) x.이력.push(h); by.set(k, x); touched.add(k); });
  const list = [...touched].map(k => by.get(k)), nNew = list.filter(x => !x.id).length; if (!list.length) { alert("회사명이 있는 줄을 찾지 못했습니다."); return; }
  if (!db || !confirm(`협업사 ${list.length}곳(새로 ${nNew}곳, 기존과 합침 ${list.length - nNew}곳)을 저장할까요? 같은 회사명·국가는 합치고 이력은 이어 붙입니다.`)) return;
  const at = new Date().toISOString(); let ok = 0;
  for (const {id, ...d} of list) { d.이력.sort(byYear); d.updatedAt = at; try { if (id) await db.doc(`partners/${id}`).set(d); else await db.collection("partners").add(d); ok++; } catch {} }
  alert(`${list.length}곳 중 ${ok}곳을 저장했습니다.`);
}
// 파일 올리기: [파일 선택] 버튼 + 끌어다 놓기 영역 (관제실과 같은 모양)
const dropBox = (k, what, accept) => `<div class="drop" id="${k}Drop" data-drop="${k}">${what}를 여기로 끌어다 놓거나 <button class="btn primary" type="button" id="${k}Pick" data-pick="${k}">파일 선택</button><input type="file" id="${k}File" data-file="${k}" accept="${accept}" hidden></div>`;
const ptFiles = async fs => { try { await ptImport(await aoaOf(fs[0])); } catch (er) { alert(er.message || "파일을 읽지 못했습니다."); } };
function drawCt() {
  if (!db) { $("tab-ct").innerHTML = '<p class="empty">이 화면에서는 저장소에 연결할 수 없습니다. 공유받은 claude.ai 페이지에서 열어 주세요.</p>'; return; }
  $("tab-ct").innerHTML = `<div class="row"><h2>국내외 협업사</h2><span style="flex:1"></span>
      ${admin && downloads ? '<button class="btn adm" type="button" id="ptXlsx">엑셀 저장</button>' : ""}<button class="btn primary" type="button" id="ptAdd">+ 협업사 추가</button></div>
    ${dropBox("pt", "협업사 엑셀(XLSX·XLS·CSV)", ".xlsx,.xls,.csv")}
    <div class="row"><input id="ptQ" type="search" placeholder="회사명·담당자 검색" value="${esc(pf.q)}" style="flex:1;min-width:160px"><select id="ptC" aria-label="국가"></select><select id="ptF" aria-label="분야"></select></div><div id="ptBox"></div>`;
  drawPt();
}
async function saveXlsx() {
  if (!admin || !downloads || !window.XLSX) { alert("이 화면에서는 파일 저장을 쓸 수 없습니다."); return; }
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([PT, ...partners.map(x => PT.map(k => x[k] || ""))]), "협업사");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["회사명", "국가", ...HI], ...partners.flatMap(x => hist(x).map(h => [x.회사명, x.국가, ...HI.map(k => h[k] || "")]))]), "협업 이력");
  try { await downloads.save({filename: `협업사_${today()}.xlsx`, data: new Uint8Array(XLSX.write(wb, {type: "array", bookType: "xlsx"}))}); } catch {}
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, tr.click"); if (!t) return;
  if (t.dataset.themeM) applyTheme(t.dataset.themeM);
  if (t.dataset.pick) $(t.dataset.pick + "File").click();
  if (t.id === "ptAdd") editPt(null);
  if (t.dataset.pt) editPt(partners.find(x => x.id === t.dataset.pt));
  if (t.id === "ptXlsx") saveXlsx();
  if (t.id === "hAdd") { ptDraft.이력.push({사업: "", 연도: "", 역할: "", 평가: ""}); drawHist(); document.querySelector(`[data-hi="${ptDraft.이력.length - 1}|사업"]`)?.focus(); }
  if (t.dataset.hdel !== undefined) { ptDraft.이력.splice(+t.dataset.hdel, 1); drawHist(); }
});
document.addEventListener("change", e => { const t = e.target;
  if (t.dataset.file && t.files.length) { const fs = [...t.files]; t.value = ""; ptFiles(fs); }
  if (t.id === "ptC") { pf.국가 = t.value; drawPt(); } if (t.id === "ptF") { pf.분야 = t.value; drawPt(); } });
document.addEventListener("input", e => { const d = e.target.dataset;
  if (d.hi) { const [i, k] = d.hi.split("|"); if (ptDraft?.이력[+i]) ptDraft.이력[+i][k] = e.target.value; }
  if (e.target.id === "ptQ") { pf.q = e.target.value; drawPt(); } });
["dragenter", "dragover", "dragleave", "drop"].forEach(ev => document.addEventListener(ev, e => { const z = e.target.closest?.("[data-drop]"); if (!z) return; e.preventDefault();
  z.classList.toggle("on", ev === "dragenter" || ev === "dragover"); if (ev === "drop" && e.dataTransfer?.files?.length) ptFiles([...e.dataTransfer.files]); }));

drawCt();
(async () => {
  let user; [db, downloads, user] = await Promise.all(["db", "downloads", "user"].map(n => window.claude?.use?.(n) ?? null));
  admin = !!user && ((await user.isOwner?.().catch(() => false)) || (await user.canEdit?.().catch(() => false)));
  document.body.classList.toggle("staff", !admin); drawCt();
  if (!db) return;
  db.collection("partners").onSnapshot(s => { partners = s.docs.map(d => ({id: d.id, ...structuredClone(d.data())})); $("ptBox") ? drawPt() : drawCt(); }, () => { $("tab-ct").innerHTML = '<p class="empty">협업사 자료를 불러오지 못했습니다. 새로고침해 주세요.</p>'; });
})();
</script>
