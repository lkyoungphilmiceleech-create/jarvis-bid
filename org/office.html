<title>JARVIS 가상 사무실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>

:root{
  color-scheme:dark;
  --bg:#060C13;--bg2:#0A1622;--glass:rgba(16,34,50,.72);--glass2:rgba(22,46,66,.55);--ink:#DDF3FA;--muted:#7F9CAB;--line:rgba(88,200,235,.22);
  --holo:#38D5F0;--holo-ink:#04121A;--holo-soft:rgba(56,213,240,.14);--amber:#F5B942;--amber-soft:rgba(245,185,66,.14);
  --go:#4BE3A0;--go-soft:rgba(75,227,160,.14);--stop:#FF7A7A;--grid:rgba(56,213,240,.07);
  --hud:"Chakra Petch","IBM Plex Sans KR",ui-monospace,monospace;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#E4ECF1;--bg2:#D6E2EA;--glass:rgba(255,255,255,.8);--glass2:rgba(240,247,250,.9);--ink:#0E2230;--muted:#557080;--line:rgba(10,110,140,.22);
  --holo:#0A7FA0;--holo-ink:#FFFFFF;--holo-soft:rgba(10,127,160,.1);--amber:#A56A06;--amber-soft:rgba(165,106,6,.1);
  --go:#127A4E;--go-soft:rgba(18,122,78,.1);--stop:#B3332B;--grid:rgba(10,127,160,.08);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#E4ECF1;--bg2:#D6E2EA;--glass:rgba(255,255,255,.8);--glass2:rgba(240,247,250,.9);--ink:#0E2230;--muted:#557080;--line:rgba(10,110,140,.22);
  --holo:#0A7FA0;--holo-ink:#FFFFFF;--holo-soft:rgba(10,127,160,.1);--amber:#A56A06;--amber-soft:rgba(165,106,6,.1);
  --go:#127A4E;--go-soft:rgba(18,122,78,.1);--stop:#B3332B;--grid:rgba(10,127,160,.08);}}
body{color:var(--ink);font:15px/1.6 var(--sans);padding-inline:16px;padding-block:16px 56px;min-height:100%;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px,radial-gradient(1200px 600px at 30% 0%,var(--bg2),var(--bg)) fixed,var(--bg)}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hudlabel{font:500 11px var(--hud);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px}
.bar .where{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.live{width:8px;height:8px;border-radius:50%;background:var(--go);box-shadow:0 0 10px var(--go);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.clock{font:700 15px var(--hud);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);font:500 12px var(--sans);padding:5px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--holo);color:var(--holo-ink)}
.name{font:700 36px/1 var(--hud);letter-spacing:.14em;color:var(--holo);text-shadow:0 0 18px var(--holo-soft)}
.role{font-weight:500}
.bubble{margin:6px 0 0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--glass2);min-height:3.2em}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.log{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;padding-right:4px}
.log:empty{display:none}
.msg{padding:8px 12px;border-radius:10px;max-width:92%;white-space:pre-wrap;word-break:break-word;font-size:14px;animation:land .35s ease-out}
.msg.me{align-self:flex-end;background:var(--holo);color:var(--holo-ink)}
.msg.ai{align-self:flex-start;border:1px solid var(--line);background:var(--glass2)}
.msg.think{color:var(--muted)}
.msg.err{border-color:var(--stop);color:var(--stop)}
.ask{display:flex;gap:6px}
.ask input{flex:1;min-width:0;font:14px var(--sans);color:var(--ink);background:var(--glass2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ask input:focus{outline:0;border-color:var(--holo);box-shadow:0 0 12px var(--holo-soft)}
.chatnote{font-size:11px;color:var(--muted)}
.caret{display:inline-block;width:7px;height:1em;background:var(--holo);vertical-align:-2px;margin-left:2px;animation:pulse 1s steps(1) infinite}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
@keyframes land{from{transform:translateX(30px);opacity:0}}
.empty{font-size:13px;color:var(--muted)}
.btn{font:500 13px var(--sans);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:4px 11px;cursor:pointer;white-space:nowrap;transition:border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--holo);box-shadow:0 0 12px var(--holo-soft)}
.btn.go{color:var(--go);border-color:color-mix(in srgb,var(--go) 50%,transparent)}
.btn.go:hover{box-shadow:0 0 12px var(--go-soft);border-color:var(--go)}
.btn.primary{background:var(--go);color:var(--holo-ink);border-color:var(--go)}
.btn.x{color:var(--muted)}
.btn.x:hover{color:var(--stop);border-color:var(--stop)}
:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
.fold>summary{cursor:pointer;list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"▸";display:inline-block;margin-right:8px;color:var(--holo);transition:transform .2s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary:hover{color:var(--holo)}
.status{font-size:12px;color:var(--amber)}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:4px 2px}
.hero h1{font:700 26px/1.2 var(--sans);margin:0;text-wrap:balance}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.on{background:var(--go);box-shadow:0 0 8px var(--go)}.dot.skill{background:var(--holo)}.dot.off{background:var(--muted);opacity:.5}
.floorwrap{padding:0;overflow-x:auto;border-radius:14px}
.floorhint{display:none;font-size:12px;color:var(--muted);margin:8px 12px 0}
@media (max-width:700px){svg.map{min-width:640px}.floorhint{display:block}}
svg.map{width:100%;height:auto;display:block}
/* 건물 재질: 어두운 밤 사무실(기본) */
.office{--sky1:#0b1a2a;--sky2:#15324a;--gnd:rgba(0,0,0,.35);
  --slab-t:#2a3a46;--slab-l:#1c2932;--slab-r:#24333e;--floor:#2c3d49;--carpet:#23455a;
  --wall-t:#4a5d69;--wall-l:#34454f;--wall-r:#3c4f5a;--win:#6fb7d6;--winop:.35;
  --wood-t:#9c7652;--wood-l:#6f5239;--wood-r:#846246;--desk-t:#d6dbe0;--desk-l:#98a3ab;--desk-r:#b3bcc3;
  --chair-t:#3a3f55;--chair-l:#262a3a;--chair-r:#303548;--sofa-t:#3f6f7d;--sofa-l:#2a4d57;--sofa-r:#355f6b;
  --mon-t:#1c2126;--mon-l:#101418;--mon-r:#171c21;--pot-t:#c9b79c;--pot-l:#8d7b62;--pot-r:#a8957a;--leaf:#3fa56a;
  --paper-t:#f4f4f0;--paper-l:#cfcfca;--paper-r:#e2e2dd;--printer-t:#e6e9ec;--printer-l:#9aa3aa;--printer-r:#bcc4ca;--board:#e9eef2;--screen:#06121c}
:root[data-theme="light"] .office{--sky1:#cfe6f5;--sky2:#eef6fb;--gnd:rgba(20,50,70,.14);
  --slab-t:#c9d3da;--slab-l:#a3b0b9;--slab-r:#b7c3cb;--floor:#e7ebee;--carpet:#c9dbe6;
  --wall-t:#f1f3f5;--wall-l:#d9dfe3;--wall-r:#e6eaed;--win:#8fd0ee;--winop:.55;--screen:#0e2a3a}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .office{--sky1:#cfe6f5;--sky2:#eef6fb;--gnd:rgba(20,50,70,.14);
  --slab-t:#c9d3da;--slab-l:#a3b0b9;--slab-r:#b7c3cb;--floor:#e7ebee;--carpet:#c9dbe6;
  --wall-t:#f1f3f5;--wall-l:#d9dfe3;--wall-r:#e6eaed;--win:#8fd0ee;--winop:.55;--screen:#0e2a3a}}
.sky{fill:url(#skyg)}.ground{fill:var(--gnd)}
.core{stroke:var(--line);stroke-width:2;stroke-dasharray:4 6}
.slab-t{fill:var(--slab-t)}.slab-l{fill:var(--slab-l)}.slab-r{fill:var(--slab-r)}
.floor-t{fill:var(--floor)}.carpet{fill:var(--carpet);opacity:.8}
.wall-t{fill:var(--wall-t)}.wall-l{fill:var(--wall-l)}.wall-r{fill:var(--wall-r)}
.win{fill:var(--win);opacity:var(--winop)}.mullion{fill:var(--wall-t)}
.wood-t{fill:var(--wood-t)}.wood-l{fill:var(--wood-l)}.wood-r{fill:var(--wood-r)}
.desk-t{fill:var(--desk-t)}.desk-l{fill:var(--desk-l)}.desk-r{fill:var(--desk-r)}
.chair-t{fill:var(--chair-t)}.chair-l{fill:var(--chair-l)}.chair-r{fill:var(--chair-r)}
.sofa-t{fill:var(--sofa-t)}.sofa-l{fill:var(--sofa-l)}.sofa-r{fill:var(--sofa-r)}
.mon-t{fill:var(--mon-t)}.mon-l{fill:var(--mon-l)}.mon-r{fill:var(--mon-r)}
.pot-t{fill:var(--pot-t)}.pot-l{fill:var(--pot-l)}.pot-r{fill:var(--pot-r)}.leaf{fill:var(--leaf)}
.paper-t{fill:var(--paper-t)}.paper-l{fill:var(--paper-l)}.paper-r{fill:var(--paper-r)}
.printer-t{fill:var(--printer-t)}.printer-l{fill:var(--printer-l)}.printer-r{fill:var(--printer-r)}
.board{fill:var(--board)}.screen{fill:var(--screen);stroke:var(--holo);stroke-width:1.5}
.glasswall{fill:var(--holo);fill-opacity:.08;stroke:var(--holo);stroke-opacity:.45;stroke-width:1.2}
.glow{fill:var(--holo);animation:glow 2.4s ease-in-out infinite}.dark{fill:#0a0d10}
@keyframes glow{50%{opacity:.6}}
.wallsign{font:700 15px var(--hud);letter-spacing:.08em;fill:var(--holo)}
.fl{font:700 26px var(--hud);fill:var(--holo)}.fln{font:600 13px var(--sans);fill:var(--muted)}
.desk{cursor:pointer;outline:none}
.nametag rect{fill:var(--glass);stroke:var(--line)}
.nametag.on rect{stroke:var(--go)}.nametag.on circle{fill:var(--go)}.nametag.skill circle{fill:var(--holo)}.nametag.off circle{fill:var(--muted)}.nametag.off{opacity:.75}
.desk .plate{font:700 12px var(--hud);letter-spacing:.06em;fill:var(--ink);text-anchor:middle}
.desk .sub{font:500 9.5px var(--sans);fill:var(--muted);text-anchor:middle}
.desk .vacant image{filter:grayscale(1);opacity:.28}
.desk.on image{animation:work 3.2s ease-in-out infinite}
.desk image{transform-box:fill-box;transform-origin:bottom}
@keyframes work{0%,100%{transform:rotate(0)}30%{transform:rotate(-2deg) translateY(-1px)}60%{transform:rotate(1.5deg)}}
.desk:hover .desk-t,.desk:focus-visible .desk-t,.desk.sel .desk-t{fill:var(--holo)}
.desk.sel .plate{fill:var(--holo)}
.typing circle{fill:var(--holo);animation:typing 1.2s infinite}
.typing circle:nth-child(3){animation-delay:.2s}.typing circle:nth-child(4){animation-delay:.4s}
@keyframes typing{0%,60%,100%{opacity:.25}30%{opacity:1}}
.bubbleS{fill:var(--glass);stroke:var(--line)}
.tag{font:700 10px var(--sans);text-anchor:middle;paint-order:stroke;stroke:var(--floor);stroke-width:3px}
.tag.off{fill:var(--muted)}.tag.skill{fill:var(--holo)}
.flow{fill:none;stroke:var(--amber);stroke-width:2.5;stroke-dasharray:6 7;opacity:.85;animation:dash 1.2s linear infinite}
.flow.later{stroke:var(--muted);opacity:.4;animation:none}
@keyframes dash{to{stroke-dashoffset:-26}}
.env{fill:var(--amber)}
.holo text{font:700 11px var(--hud);fill:var(--holo)}.holo .big{font-size:15px}
.chat{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.clog{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;padding-right:4px}
.clog:empty{display:none}
.msg{padding:8px 12px;border-radius:12px;max-width:92%;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.6}
.msg.me{align-self:flex-end;background:var(--holo);color:var(--holo-ink)}
.msg.ai{align-self:flex-start;border:1px solid var(--line);background:var(--glass2)}
.msg.err{border-color:var(--stop);color:var(--stop)}
.msg .by{display:flex;align-items:center;gap:6px;font:700 12px var(--hud);letter-spacing:.06em;color:var(--holo);margin-bottom:2px}
.msg .by img{width:22px;height:22px}
.msg.sum{border-color:var(--amber);background:var(--amber-soft)}
.ask{display:flex;gap:6px}
.ask textarea{flex:1;min-width:0;min-height:42px;max-height:160px;resize:vertical;font:14px/1.5 var(--sans);color:var(--ink);background:var(--glass2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ask textarea:focus{outline:0;border-color:var(--holo);box-shadow:0 0 12px var(--holo-soft)}
.meet{padding:18px;display:flex;flex-direction:column;gap:10px}
.meet[hidden]{display:none}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;cursor:pointer;font:13px var(--sans)}
.pick label:has(input:checked){border-color:var(--holo);background:var(--holo-soft)}
.pick img{width:26px;height:26px}
.pick input{accent-color:var(--holo)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.panel{padding:18px;display:flex;flex-direction:column;gap:10px}
.who{display:flex;gap:14px;align-items:center}
.who img{width:84px;height:84px}
.who h2{margin:0;font:700 26px/1 var(--hud);letter-spacing:.12em;color:var(--holo)}
.who .r{font-weight:500}
.st{font:700 11px var(--sans);padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.st.on{color:var(--go);border-color:var(--go)}.st.skill{color:var(--holo);border-color:var(--holo)}.st.off{color:var(--muted)}
.panel ul{margin:0;padding-left:18px;font-size:14px}
.today{padding:14px 16px}
.today .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:8px}
.today a.card{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--glass2);color:var(--ink);text-decoration:none}
.today a.card:hover,.today a.card:focus-visible{border-color:var(--holo)}
.today .card b{font:700 22px var(--hud);color:var(--holo)}
.today .card small{font-size:12px;color:var(--muted);line-height:1.45}
.today .links{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.kpi{display:flex;gap:18px;flex-wrap:wrap}
.kpi b{display:block;font:700 22px var(--hud);color:var(--holo)}
.kpi span{font-size:12px;color:var(--muted)}
.roster{padding:18px}
.roster h2{font:700 15px var(--hud);letter-spacing:.04em;margin:0 0 10px}
.team{display:flex;flex-direction:column;gap:6px}
.team button{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font:14px var(--sans)}
.team button[aria-pressed="true"]{border-color:var(--holo);background:var(--holo-soft)}
.team img{width:32px;height:32px}
.team small{display:block;color:var(--muted);font-size:12px}
.team h3{margin:12px 0 4px;font:500 12px var(--sans);color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>

<div class="wrap">
  <header class="glass bar">
    <div class="where"><span class="live" aria-hidden="true"></span><span class="hudlabel">JARVIS OPS</span><span>본사 · 가상 사무실</span></div>
    <div class="where"><span class="clock" id="clock">--:--:--</span><span class="hudlabel">KST</span>
      <div class="seg" role="group" aria-label="화면 모드"><button type="button" data-mode="system">시스템</button><button type="button" data-mode="light">라이트</button><button type="button" data-mode="dark">다크</button></div>
    </div>
  </header>

  <div class="hero">
    <div><h1>JARVIS 빌딩</h1><p>2F 제안서 준비 본부 · 1F 사업 수행 본부 · 자리를 누르면 담당자 정보와 업무실 입구가 열립니다.</p></div>
    <button class="btn primary" type="button" id="openMeet">2F 회의실 열기</button><div class="legend"><span><i class="dot on"></i>근무 중</span><span><i class="dot skill"></i>스킬 보유(채팅으로 업무)</span><span><i class="dot off"></i>채용 예정</span></div>

    <div><span class="st ${cls(t.상태)}">${esc(t.상태)}</span></div>
    ${k ? `<div class="kpi">${k.map(([v, l]) => `<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div>` : ""}
    <div class="hudlabel">담당 업무</div><ul>${t.업무.map(w => `<li>${esc(w)}</li>`).join("")}</ul>
    ${t.page ? `<a class="btn primary" href="${esc(t.page)}" target="_blank" rel="noopener">${esc(t.code)} 업무실 들어가기 ↗</a>`
      : t.상태 === "스킬 보유" ? `<p class="chatnote">전용 업무실은 아직 없습니다. JARVIS 채팅에서 요청하면 이 직원의 스킬로 바로 처리합니다.</p>`
      : `<p class="chatnote">아직 채용 전입니다. JARVIS에게 "${esc(t.code)} 만들자"라고 말씀해 주세요.</p>`}
    ${t.상태 === "근무 중" ? `<div class="chat"><div class="hudlabel">${esc(t.code)}와 대화</div><div class="clog" id="clog"></div>
      <div class="ask"><textarea id="cq" placeholder="${esc(t.code)}에게 물어보세요"></textarea><button class="btn primary" type="button" id="cgo">보내기</button></div>
      <p class="chatnote" id="cnote">업무 자료(${esc(D.지식시각)} 기준)를 바탕으로 답합니다. 대화는 본부장님만 볼 수 있게 저장됩니다.</p></div>` : ""}`;
  drawChat();
}
// ── 대화: 1:1과 회의실. Claude 호출은 본부장님 계정 사용량으로 처리된다
let sample = null, db = null, uid = null, chats = {}, meetings = [], busy = false;
const working = staff.filter(t => t.상태 === "근무 중");
function persona(t) {
  return `너는 JARVIS 조직 ${t.본부} ${t.팀}의 ${t.역할} ${t.code}다. 사용자는 우리 회사 본부장이며 "본부장님"이라고 부른다.
담당 업무: ${t.업무.join(" / ")}
[업무 자료, ${D.지식시각} 기준]
${D.지식?.[t.code] || "이 화면에 실린 업무 자료가 없다. 일반 지식으로 답하고, 자료가 없다는 점을 밝힌다."}
규칙: 한국어로 짧고 쉽게, 결론 먼저(3~6문장 또는 개조식). 업무 자료에 있는 사실은 날짜·출처와 함께 말하고, 없는 사실은 지어내지 않는다. 최신 웹 조사·파일 작성·저장 같은 실제 작업이 필요하면 담당 업무실${t.page ? `(${t.page})` : ""}이나 JARVIS 채팅에서 요청하도록 안내한다. 오늘은 ${new Date().toLocaleDateString("ko-KR", {timeZone: "Asia/Seoul"})}.`;
}
const bubble = (m, t) => `<div class="msg ${m.r === "me" ? "me" : "ai"}${m.err ? " err" : ""}${m.sum ? " sum" : ""}">${m.r === "me" ? "" : `<div class="by">${t ? `<img alt="" src="${D.avatars[t.avatar]}">` : ""}${esc(m.by || t?.code || "JARVIS")}</div>`}${esc(m.t)}</div>`;
function drawChat() {
  const t = staff.find(x => x.code === sel), log = $("clog"); if (!log) return;
  log.innerHTML = (chats[sel] || []).map(m => bubble(m, t)).join(""); log.scrollTop = log.scrollHeight;
}
const errText = e => ({not_granted: "Claude 사용이 허용되지 않았습니다.", rate_limited: "요청이 많습니다. 잠시 후 다시 보내 주세요.", prompt_too_large: "대화가 너무 깁니다. 새 대화로 시작해 주세요."}[e?.code] || "답을 받지 못했습니다. 다시 보내 주세요.");
async function saveChat(code) { if (db && uid) db.doc(`data/users/${uid}/chat_${code}`).set({msgs: (chats[code] || []).slice(-60)}).catch(() => {}); }
async function sendChat() {
  const q = $("cq").value.trim(), t = staff.find(x => x.code === sel); if (!q || busy) return;
  if (!sample) { $("cnote").textContent = "이 화면에서는 대화를 쓸 수 없습니다. claude.ai에서 열어 주세요."; return; }
  const code = sel, list = chats[code] = chats[code] || [];
  list.push({r: "me", t: q, at: new Date().toISOString()}); $("cq").value = ""; busy = true; $("cgo").disabled = true;
  const ai = {r: "ai", t: "…", at: new Date().toISOString()}; list.push(ai); drawChat();
  const turns = list.slice(-13, -1).map(m => ({role: m.r === "me" ? "user" : "assistant", content: m.t}));
  try { const r = await sample([{role: "user", content: persona(t)}, {role: "assistant", content: `네, ${t.code}입니다.`}, ...turns], {cache: false, onText: ({text}) => { ai.t = text; if (sel === code) drawChat(); }}); ai.t = r.text; }
  catch (e) { ai.t = (e?.text ? e.text + "\n\n" : "") + errText(e); ai.err = true; }
  busy = false; if ($("cgo")) $("cgo").disabled = false; if (sel === code) drawChat(); saveChat(code);
}
function drawMeet() {
  $("kAt").textContent = `업무 자료 ${D.지식시각} 기준`;
  if (!$("pick").children.length) $("pick").innerHTML = working.map(t => `<label><input type="checkbox" value="${esc(t.code)}"><img alt="" src="${D.avatars[t.avatar]}">${esc(t.code)}</label>`).join("");
  $("mhist").innerHTML = meetings.slice().reverse().map((m, i) => `<button class="btn" type="button" data-mh="${meetings.length - 1 - i}" style="text-align:left;white-space:normal">${esc(m.at.slice(0, 16).replace("T", " "))} · ${esc(m.안건.slice(0, 50))} <span class="chatnote">(${esc(m.참석.join(", "))})</span></button>`).join("") || '<p class="chatnote">아직 회의록이 없습니다.</p>';
}
async function runMeet() {
  const q = $("mq").value.trim(), who = [...$("pick").querySelectorAll("input:checked")].map(i => i.value);
  if (!q || busy) return; if (!who.length) { alert("참석자를 한 명 이상 골라 주세요."); return; }
  if (!sample) { alert("이 화면에서는 회의를 열 수 없습니다. claude.ai에서 열어 주세요."); return; }
  busy = true; $("mgo").disabled = true;
  const rec = {at: new Date().toISOString(), 안건: q, 참석: who, 발언: [], 종합: ""}, log = [{r: "me", t: q}];
  const draw = () => { $("mlog").innerHTML = log.map(m => bubble(m, staff.find(x => x.code === m.by))).join(""); $("mlog").scrollTop = $("mlog").scrollHeight; };
  for (const code of who) {
    const t = staff.find(x => x.code === code), m = {r: "ai", by: code, t: "…"}; log.push(m); draw();
    const before = rec.발언.map(s => `${s.code}: ${s.t}`).join("\n\n") || "(아직 없음)";
    try { const r = await sample(`${persona(t)}\n\n[회의] 본부장님이 연 회의다. 참석: ${who.join(", ")}.\n안건: ${q}\n[앞선 발언]\n${before}\n\n너의 담당 관점에서만 2~5문장으로 발언한다. 앞선 발언을 반복하지 말고, 필요하면 다른 직원 발언에 보태거나 이견을 말한다.`, {cache: false, onText: ({text}) => { m.t = text; draw(); }}); m.t = r.text; }
    catch (e) { m.t = errText(e); m.err = true; }
    rec.발언.push({code, t: m.t}); draw();
  }
  const s = {r: "ai", by: "JARVIS 종합", t: "…", sum: true}; log.push(s); draw();
  try { const r = await sample(`너는 회의 사회자 JARVIS다. 사용자는 본부장이며 "본부장님"이라고 부른다.\n안건: ${q}\n[발언]\n${rec.발언.map(x => `${x.code}: ${x.t}`).join("\n\n")}\n\n본부장님께 드릴 종합을 한국어 개조식으로 짧게: 1) 결론 2) 할 일(담당 직원·기한) 3) 본부장님 결정이 필요한 것. 발언에 없는 사실은 만들지 않는다.`, {cache: false, onText: ({text}) => { s.t = text; draw(); }}); s.t = r.text; }
  catch (e) { s.t = errText(e); s.err = true; }
  draw(); rec.종합 = s.t; meetings.push(rec); meetings = meetings.slice(-20);
  if (db && uid) db.doc(`data/users/${uid}/meetings`).set({list: meetings}).catch(() => {});
  busy = false; $("mgo").disabled = false; $("mq").value = ""; drawMeet();
}
$("roster").innerHTML = D.본부.map(b => `<h3>${esc(b.이름)}</h3>` + b.팀.map(t => `<button type="button" data-code="${esc(t.code)}"><img alt="" src="${D.avatars[t.avatar]}"><span>${esc(t.code)}<small>${esc(t.팀)}</small></span><i class="dot ${cls(t.상태)}" title="${esc(t.상태)}"></i></button>`).join("")).join("");
document.addEventListener("click", e => {
  const d = e.target.closest("[data-code]"); if (d) show(d.dataset.code);
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "cgo") sendChat();
  if (b.id === "openMeet") { $("meet").hidden = false; drawMeet(); $("meet").scrollIntoView({behavior: "smooth"}); }
  if (b.id === "closeMeet") $("meet").hidden = true;
  if (b.id === "mgo") runMeet();
  if (b.dataset.mh) { const m = meetings[+b.dataset.mh]; $("mlog").innerHTML = [{r: "me", t: m.안건}, ...m.발언.map(x => ({r: "ai", by: x.code, t: x.t})), {r: "ai", by: "JARVIS 종합", t: m.종합, sum: true}].map(x => bubble(x, staff.find(s => s.code === x.by))).join(""); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && (e.target.id === "cq")) { e.preventDefault(); sendChat(); } });
document.addEventListener("keydown", e => { const d = e.target.closest?.(".desk"); if (d && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); show(d.dataset.code); } });
show(sel);
(async () => {
  [sample, db] = await Promise.all(["sample", "db"].map(n => window.claude?.use?.(n) ?? null));
  const user = await window.claude?.use?.("user"); uid = await user?.id?.().catch(() => null);
  if (!db || !uid) return;
  const snap = await db.collection(`data/users/${uid}`).get().catch(() => null);
  snap?.docs.forEach(d => { if (d.id.startsWith("chat_")) chats[d.id.slice(5)] = d.data().msgs || []; if (d.id === "meetings") meetings = d.data().list || []; });
  drawChat(); if (!$("meet").hidden) drawMeet();
})();
</script>
