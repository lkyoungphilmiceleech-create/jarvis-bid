<title>사업 수행 본부 업무 데스크</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>

:root{
  color-scheme:dark;
  --bg:#060C13;--bg2:#0A1622;--glass:rgba(16,34,50,.72);--glass2:rgba(22,46,66,.55);--ink:#DDF3FA;--muted:#7F9CAB;--line:rgba(88,200,235,.22);
  --holo:#38D5F0;--holo-ink:#04121A;--holo-soft:rgba(56,213,240,.14);--amber:#F5B942;--amber-soft:rgba(245,185,66,.14);
  --go:#4BE3A0;--go-soft:rgba(75,227,160,.14);--stop:#FF7A7A;--grid:rgba(56,213,240,.07);
  --hud:"Chakra Petch","IBM Plex Sans KR",ui-monospace,monospace;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#E4ECF1;--bg2:#D6E2EA;--glass:rgba(255,255,255,.8);--glass2:rgba(240,247,250,.9);--ink:#0E2230;--muted:#557080;--line:rgba(10,110,140,.22);
  --holo:#0A7FA0;--holo-ink:#FFFFFF;--holo-soft:rgba(10,127,160,.1);--amber:#A56A06;--amber-soft:rgba(165,106,6,.1);
  --go:#127A4E;--go-soft:rgba(18,122,78,.1);--stop:#B3332B;--grid:rgba(10,127,160,.08);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#E4ECF1;--bg2:#D6E2EA;--glass:rgba(255,255,255,.8);--glass2:rgba(240,247,250,.9);--ink:#0E2230;--muted:#557080;--line:rgba(10,110,140,.22);
  --holo:#0A7FA0;--holo-ink:#FFFFFF;--holo-soft:rgba(10,127,160,.1);--amber:#A56A06;--amber-soft:rgba(165,106,6,.1);
  --go:#127A4E;--go-soft:rgba(18,122,78,.1);--stop:#B3332B;--grid:rgba(10,127,160,.08);}}
body{color:var(--ink);font:15px/1.6 var(--sans);padding-inline:16px;padding-block:16px 56px;min-height:100%;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px,radial-gradient(1200px 600px at 30% 0%,var(--bg2),var(--bg)) fixed,var(--bg)}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hudlabel{font:500 11px var(--hud);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px}
.bar .where{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.live{width:8px;height:8px;border-radius:50%;background:var(--go);box-shadow:0 0 10px var(--go);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.clock{font:700 15px var(--hud);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);font:500 12px var(--sans);padding:5px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--holo);color:var(--holo-ink)}
.name{font:700 36px/1 var(--hud);letter-spacing:.14em;color:var(--holo);text-shadow:0 0 18px var(--holo-soft)}
.role{font-weight:500}
.bubble{margin:6px 0 0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--glass2);min-height:3.2em}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.log{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;padding-right:4px}
.log:empty{display:none}
.msg{padding:8px 12px;border-radius:10px;max-width:92%;white-space:pre-wrap;word-break:break-word;font-size:14px;animation:land .35s ease-out}
.msg.me{align-self:flex-end;background:var(--holo);color:var(--holo-ink)}
.msg.ai{align-self:flex-start;border:1px solid var(--line);background:var(--glass2)}
.msg.think{color:var(--muted)}
.msg.err{border-color:var(--stop);color:var(--stop)}
.ask{display:flex;gap:6px}
.ask input{flex:1;min-width:0;font:14px var(--sans);color:var(--ink);background:var(--glass2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ask input:focus{outline:0;border-color:var(--holo);box-shadow:0 0 12px var(--holo-soft)}
.chatnote{font-size:11px;color:var(--muted)}
.caret{display:inline-block;width:7px;height:1em;background:var(--holo);vertical-align:-2px;margin-left:2px;animation:pulse 1s steps(1) infinite}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
@keyframes land{from{transform:translateX(30px);opacity:0}}
.empty{font-size:13px;color:var(--muted)}
.btn{font:500 13px var(--sans);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:4px 11px;cursor:pointer;white-space:nowrap;transition:border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--holo);box-shadow:0 0 12px var(--holo-soft)}
.btn.go{color:var(--go);border-color:color-mix(in srgb,var(--go) 50%,transparent)}
.btn.go:hover{box-shadow:0 0 12px var(--go-soft);border-color:var(--go)}
.btn.primary{background:var(--go);color:var(--holo-ink);border-color:var(--go)}
.btn.x{color:var(--muted)}
.btn.x:hover{color:var(--stop);border-color:var(--stop)}
:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
.fold>summary{cursor:pointer;list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"▸";display:inline-block;margin-right:8px;color:var(--holo);transition:transform .2s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary:hover{color:var(--holo)}
.status{font-size:12px;color:var(--amber)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.staff{padding:14px;display:flex;flex-direction:column;gap:8px;align-self:start}
.staff button{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;font:14px var(--sans)}
.staff button[aria-pressed="true"]{border-color:var(--holo);background:var(--holo-soft)}
.staff img{width:52px;height:52px}
.staff b{font:700 15px var(--hud);letter-spacing:.08em}
.staff small{display:block;color:var(--muted);font-size:12px}
@media (max-width:820px){.staff{flex-direction:row;overflow-x:auto}.staff button{min-width:190px}}
.work{padding:18px;display:flex;flex-direction:column;gap:14px}
.who{display:flex;gap:14px;align-items:center}
.who img{width:96px;height:96px;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.who h1{margin:0;font:700 30px/1 var(--hud);letter-spacing:.12em;color:var(--holo)}
.who .r{font-weight:500;margin-top:4px}
.modes{display:flex;flex-wrap:wrap;gap:8px}
.modes button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font:500 13px var(--sans)}
.modes button[aria-pressed="true"]{background:var(--holo);color:var(--holo-ink);border-color:var(--holo)}
.mdesc{margin:0;font-size:13px;color:var(--muted)}
textarea{width:100%;min-height:170px;resize:vertical;font:14px/1.6 var(--sans);color:var(--ink);background:var(--glass2);border:1px solid var(--line);border-radius:10px;padding:12px;box-sizing:border-box}
textarea:focus{outline:0;border-color:var(--holo);box-shadow:0 0 12px var(--holo-soft)}
.run{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.out{white-space:pre-wrap;word-break:break-word;padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--glass2);font-size:14px;line-height:1.7;min-height:80px}
.out.wait{color:var(--muted)}
.out.err{border-color:var(--stop);color:var(--stop)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font:13px var(--sans)}
.hist button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>

<div class="wrap">
  <header class="glass bar">
    <div class="where"><span class="live" aria-hidden="true"></span><a class="btn" href="https://claude.ai/artifact/SjbUn8evVwWawSDft2cySC" target="_blank" rel="noopener noreferrer" style="text-decoration:none" title="가상 사무실(홈)로 가기">🏢 사무실</a><span class="hudlabel">JARVIS OPS</span><span>사업 수행 본부 · 1F 업무 데스크</span></div>
    <div class="where"><span class="clock" id="clock">--:--:--</span><span class="hudlabel">KST</span>
      <div class="seg" role="group" aria-label="화면 모드"><button type="button" data-mode="system">시스템</button><button type="button" data-mode="light">라이트</button><button type="button" data-mode="dark">다크</button></div>
    </div>
  </header>
  <div class="layout">
    <nav class="glass staff" id="staff" aria-label="직원 선택"></nav>
    <section class="glass work">
      <div class="who"><img id="av" alt=""><div><h1 id="code"></h1><div class="r" id="role"></div><p class="bubble"><span id="say"></span></p></div></div>
      <div class="hudlabel">업무 선택</div>
      <div class="modes" id="modes"></div>
      <p class="mdesc" id="mdesc"></p>
      <label class="hudlabel" for="input">자료 붙여넣기</label>
      <textarea id="input" placeholder=""></textarea>
      <div class="run"><button class="btn primary" type="button" id="go">업무 맡기기</button><button class="btn" type="button" id="stop" hidden>멈춤</button><span class="note" id="status"></span></div>
      <div class="out" id="out" aria-live="polite" hidden></div>
      <div class="run" id="outActs" hidden><button class="btn" type="button" id="copy">복사</button><button class="btn" type="button" id="save">텍스트 파일로 저장</button><span class="note" id="actNote"></span></div>
      <div class="hudlabel">최근 업무 (본부장님만 보임)</div>
      <div class="hist" id="hist"><p class="note">아직 맡긴 업무가 없습니다.</p></div>
      <p class="note">결과는 본부장님 Claude 계정으로 작성되며 사용량이 조금씩 쓰입니다. 이 페이지에서는 웹 검색과 파일(HWPX) 생성은 하지 않습니다. 필요하면 JARVIS 채팅에 요청해 주세요.</p>
    </section>
  </div>
</div>

<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const applyMode = m => {
  if (m === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = m;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
  try { localStorage.setItem("desk-mode", m); } catch {}
};
let mode = "system"; try { mode = localStorage.getItem("desk-mode") || "system"; } catch {}
applyMode(mode); document.querySelectorAll(".seg button").forEach(b => b.onclick = () => applyMode(b.dataset.mode));
const tick = () => $("clock").textContent = new Date().toLocaleTimeString("en-GB", {hour12: false, timeZone: "Asia/Seoul"});
tick(); setInterval(tick, 1000);

let who = D.staff[0].code, modeIdx = 0, sample = null, db = null, downloads = null, uid = null, ctl = null, honor = "본부장님", hist = [];
const cur = () => D.staff.find(s => s.code === who);
function draw() {
  const s = cur(), m = s.modes[modeIdx];
  $("staff").innerHTML = D.staff.map(x => `<button type="button" data-who="${x.code}" aria-pressed="${x.code === who}"><img alt="" src="${D.avatars[x.avatar]}"><span><b>${esc(x.code)}</b><small>${esc(x.팀)}</small></span></button>`).join("");
  $("av").src = D.avatars[s.avatar]; $("code").textContent = s.code; $("role").textContent = `${s.역할} · ${s.팀}`;
  $("say").textContent = `${honor}, ${s.인사}`;
  $("modes").innerHTML = s.modes.map((x, i) => `<button type="button" data-mode-i="${i}" aria-pressed="${i === modeIdx}">${esc(x.label)}</button>`).join("");
  $("mdesc").textContent = m.desc; $("input").placeholder = m.placeholder;
  drawHist();
}
function drawHist() {
  const mine = hist.filter(h => h.who === who);
  $("hist").innerHTML = mine.length ? mine.slice(0, 12).map(h => `<button type="button" data-h="${esc(h.at)}"><span>${esc(h.mode)} · ${esc(h.input.slice(0, 40))}</span><span class="note">${esc(h.at.slice(5, 16).replace("T", " "))}</span></button>`).join("") : '<p class="note">아직 맡긴 업무가 없습니다.</p>';
}
function show(text, cls) { const o = $("out"); o.hidden = false; o.className = "out" + (cls ? " " + cls : ""); o.textContent = text; $("outActs").hidden = cls === "wait" || !text; }

async function run() {
  const text = $("input").value.trim(); if (!text || ctl) return;
  if (!sample) { show("이 화면에서는 Claude에게 업무를 맡길 수 없습니다. claude.ai에서 열어 주세요.", "err"); return; }
  const s = cur(), m = s.modes[modeIdx], skill = D.skills[m.skill];
  const rules = `너는 JARVIS 조직 사업 수행 본부 ${s.팀}의 ${s.역할} ${s.code}다. 사용자는 우리 회사 본부장이며 "${honor}"이라고 부른다.
아래 [업무 지침]을 그대로 따른다. 단, 이 화면에서는 웹 검색·외부 도구·파일 생성을 쓸 수 없다. 그런 단계는 건너뛰고 사용자가 준 자료만으로 결과를 작성한다. 파일(HWPX·docx 등)을 만들라는 지침은 같은 구조의 본문 텍스트로 대체한다. 자료가 부족하면 결과 끝에 "추가로 필요한 정보"를 짧게 적는다. 지어내지 않는다.
오늘은 ${new Date().toLocaleDateString("ko-KR", {timeZone: "Asia/Seoul"})}.
[업무 지침: ${m.skill}]
${skill}`;
  ctl = new AbortController(); $("go").disabled = true; $("stop").hidden = false; $("status").textContent = "";
  show(`${s.code}가 작업 중입니다…`, "wait");
  try {
    const {text: out, truncated} = await sample([{role: "user", content: rules}, {role: "user", content: `[${m.label}] 요청 자료:\n${text}`}], {cache: false, signal: ctl.signal, onText: ({text: t}) => show(t)});
    show(out); if (truncated) $("status").textContent = "답이 길어 중간에 끊겼습니다. 자료를 나눠서 맡겨 주세요.";
    const rec = {who, mode: m.label, input: text.slice(0, 4000), output: out, at: new Date().toISOString()};
    hist.unshift(rec); hist = hist.slice(0, 40); drawHist();
    if (db && uid) db.doc(`data/users/${uid}/desk`).set({hist, updatedAt: rec.at}).catch(() => {});
  } catch (e) {
    const copy = {not_granted: "Claude 사용이 허용되지 않았습니다.", rate_limited: "요청이 많습니다. 잠시 후 다시 맡겨 주세요.", session_expired: "다시 로그인해 주세요.", prompt_too_large: "자료가 너무 깁니다. 나눠서 맡겨 주세요."}[e.code];
    if (e.code === "cancelled") show((e.text || "") + "\n(멈춤)");
    else show((e.text ? e.text + "\n\n" : "") + (copy || "결과를 받지 못했습니다. 다시 맡겨 주세요."), "err");
  }
  ctl = null; $("go").disabled = false; $("stop").hidden = true;
}
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.who) { who = t.dataset.who; modeIdx = 0; $("out").hidden = true; $("outActs").hidden = true; draw(); }
  if (t.dataset.modeI) { modeIdx = +t.dataset.modeI; draw(); }
  if (t.dataset.h) { const h = hist.find(x => x.at === t.dataset.h); if (h) { $("input").value = h.input; show(h.output); } }
  if (t.id === "go") run();
  if (t.id === "stop") ctl?.abort();
  if (t.id === "copy") { try { await navigator.clipboard.writeText($("out").textContent); $("actNote").textContent = "복사했습니다."; } catch { $("actNote").textContent = "복사가 막혀 있습니다. 결과를 직접 선택해 복사해 주세요."; } }
  if (t.id === "save") {
    if (!downloads) { $("actNote").textContent = "이 화면에서는 파일 저장을 쓸 수 없습니다."; return; }
    const m = cur().modes[modeIdx];
    try { await downloads.save({filename: `${who}_${m.label}_${new Date().toISOString().slice(0, 10)}.txt`, data: $("out").textContent}); $("actNote").textContent = "저장했습니다."; }
    catch (err) { $("actNote").textContent = err?.code === "declined" ? "" : "저장하지 못했습니다."; }
  }
});
draw();
(async () => {
  [db, sample, downloads] = await Promise.all(["db", "sample", "downloads"].map(n => window.claude?.use?.(n) ?? null));
  if (db && sample) { const user = await window.claude.use("user"); uid = await user?.id?.();
    if (uid) db.doc(`data/users/${uid}/desk`).get().then(s => { if (s.exists) { hist = structuredClone(s.data()).hist || []; drawHist(); } }).catch(() => {}); }
})();
</script>
