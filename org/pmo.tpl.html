<style>

  --oc1:#F4FAFD;--oc2:#CFE3EC;--landc:#B9CFDA;--landhas:#8FB6C8;--t1:#0A7FA0;--t2:#B07406;--t3:#127A4E;--t4:#6B45C9;--t5:#C23F76;--t6:#2F5FC4;
}

  --holo:#0A7FA0;--holo-ink:#FFFFFF;--holo-soft:rgba(10,127,160,.1);--amber:#A56A06;--amber-soft:rgba(165,106,6,.1);

  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px,radial-gradient(1200px 600px at 30% 0%,var(--bg2),var(--bg)) fixed,var(--bg)}

.note{font-size:12px;color:var(--muted);margin:0}

@keyframes bob{50%{transform:translateY(-4px)}}

.tabs{display:flex;gap:8px;flex-wrap:wrap}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px}

table{border-collapse:collapse;width:100%;font-size:13px}

dialog.side{margin:0 0 0 auto;height:100%;max-height:100%;max-width:560px;width:100%;box-sizing:border-box;border-radius:0;border-width:0 0 0 1px;overflow:auto}

.chk{flex-direction:row!important;align-items:center;gap:3px;white-space:nowrap;color:var(--ink)!important}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>

.ev{border:0;border-radius:4px;padding:1px 4px;font:11px var(--sans);text-align:left;background:var(--holo-soft);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;max-width:100%}

<script>

  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/); return m ? `20${m[3]}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}` : ""; };

const BR = () => RB(cur);
// 장부 행: 예전 형식(일자·거래처·적요·공급가액)도 '전체 내역서' 모양으로 읽는다
const nl = e => e.지출일 !== undefined ? e : {...e, 지출일: e.일자, 지출항목: e.적요, 공급업체: e.거래처, 비고: e.메모, 결제방법: e.증빙, 외화: "",

function ridOf(e, rows) {

  for (const f of [r => nk(r.구분) === k[0] && nk(r.항목) === k[1], r => nk(r.항목) === k[1] && nk(r.내용) === k[2]]) { const m = rows.filter(f); if (m.length === 1) return m[0].id; }

  L().map(nl).forEach(e => { const rid = ridOf(e, rows), a = num(e.과세액), b = num(e.영세액);
    s.집행 += a + b; s.과세.집행 += a; s.영세.집행 += b;

    {k: "담당 PM", done: !!p.PM, hint: "참여인력 등록 후 설정에서 담당 PM 선택", tab: "set"},
    {k: "인력 배치", done: PP().length > 0, hint: "참여인력 탭의 사내 직원 명부에서 골라 배치", tab: "ppl"},

    <p class="note">${n >= 0 ? `다음 할 일: <b>${esc(st[n].k)}</b> — ${esc(st[n].hint)}` : "착수 준비를 모두 마쳤습니다."}</p>`;

const progOf = w => w.length ? w.reduce((a, t) => a + (t.상태 === "완료" ? 1 : (t.하위 || []).length ? t.하위.filter(x => x.완료).length / t.하위.length : 0), 0) / w.length : null;

// ── 사업 건강도: 기간 경과 대비 공정 진척, 예산 집행(예산 대비), 지연
function health(p = P()) {

  const prog = progOf(w);
  const late = lateList().length, open = w.reduce((a, t) => a + (t.보고 || []).filter(r => !r.해결).length, 0), gap = el !== null && prog !== null ? prog - el : null;
