<style>

body{color:var(--ink);font:15px/1.6 var(--sans);padding-inline:16px;padding-block:16px 56px;min-height:100%;

<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const opt = (list, v, blank) => (blank !== undefined ? `<option value="">${blank}</option>` : "") + list.map(x => Array.isArray(x) ? `<option value="${esc(x[0])}"${x[0] === v ? " selected" : ""}>${esc(x[1])}</option>` : `<option${x === v ? " selected" : ""}>${esc(x)}</option>`).join("");
const won = n => (Math.round(+n || 0)).toLocaleString("ko-KR");
const num = v => +String(v ?? "").replace(/[^\d.\-]/g, "") || 0;
const today = () => new Date().toLocaleDateString("sv-SE", {timeZone: "Asia/Seoul"});
const applyTheme = m => { if (m === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = m;
  document.querySelectorAll("[data-theme-m]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeM === m)); try { localStorage.setItem("pmo-theme", m); } catch {} };
let th = "system"; try { th = localStorage.getItem("pmo-theme") || "system"; } catch {} applyTheme(th);
const tick = () => $("clock").textContent = new Date().toLocaleTimeString("en-GB", {hour12: false, timeZone: "Asia/Seoul"}); tick(); setInterval(tick, 1000);

const STAT = ["대기", "요청", "진행", "검토", "완료", "지연"];
const TAX = ["과세", "영세"];
const PROOF = ["세금계산서", "영세율 세금계산서", "카드", "영수증", "해외 인보이스", "기타"];
let db = null, sample = null, mcp = null, downloads = null;
let projects = [], people = [], wbs = {}, budget = {}, ledger = [], cur = null, tab = "wbs";
try { cur = localStorage.getItem("pmo-proj"); tab = localStorage.getItem("pmo-tab") || "wbs"; } catch {}
const P = () => projects.find(p => p.id === cur);
const W = () => (wbs[cur]?.items) || [];
const B = () => budget[cur];
const L = () => ledger.filter(e => e.pid === cur);

// ── 계산: 예산·수익률 (금액은 모두 공급가액, 부가세 별도)
function money() {
  const p = P() || {}, rows = (B()?.rows || []).filter(r => !r.제목행), led = L();
  const ledBy = {}; led.forEach(e => ledBy[e.rid] = (ledBy[e.rid] || 0) + num(e.공급가액));
  const s = {계약: num(p.계약금액), 예산: 0, 예정: 0, 집행: 0, 전망: 0, 장부: 0, 과세: {예산: 0, 예정: 0, 집행: 0}, 영세: {예산: 0, 예정: 0, 집행: 0}};
  rows.forEach(r => { const t = r.과세 === "영세" ? "영세" : "과세", a = num(r.금액), pl = num(r.예정), ex = num(r.집행);
    s.예산 += a; s.예정 += pl; s.집행 += ex; s[t].예산 += a; s[t].예정 += pl; s[t].집행 += ex;
    s.전망 += ex || pl || a; });
  led.forEach(e => s.장부 += num(e.공급가액));
  s.예상수익률 = s.계약 ? (s.계약 - s.전망) / s.계약 * 100 : null;
  s.확정수익률 = s.계약 ? (s.계약 - s.집행) / s.계약 * 100 : null;
  s.ledBy = ledBy; return s;
}
const pct = v => v === null || v === undefined ? "–" : `${v.toFixed(1)}%`;
function drawTop() {
  $("pSel").innerHTML = projects.length ? opt(projects.map(p => [p.id, p.이름 || "(이름 없음)"]), cur) : '<option value="">프로젝트 없음</option>';
  const p = P(); if (!p) { $("kp").innerHTML = ""; return; }
  const m = money(), w = W(), done = w.filter(t => t.상태 === "완료").length, late = w.filter(t => t.상태 === "지연" || (t.상태 !== "완료" && t.종료 && t.종료 < today())).length;
  $("kp").innerHTML = [["계약(공급가)", won(m.계약)], ["예산", won(m.예산)], ["집행", won(m.집행)], ["예상 수익률", pct(m.예상수익률), m.예상수익률 < 0 ? "bad" : "hot"], ["확정 수익률", pct(m.확정수익률)], ["공정", w.length ? `${done}/${w.length}` : "–"], ["지연", late, late ? "bad" : ""]]
    .map(([k, v, c]) => `<div class="${c || ""}"><span class="hudlabel">${k}</span><b>${v}</b></div>`).join("");
}
function say() {
  const p = P();

  $("dlg").onclose = async () => { const v = $("dlg").returnValue; if (!v || v === "cancel" || !db) return;
    if (v === "del") { if (confirm("삭제할까요?")) await db.doc(`people/${x.id}`).delete().catch(() => {}); return; }
    const n = {}; $("dlgForm").querySelectorAll("[data-xf]").forEach(el => n[el.dataset.xf] = el.value.trim()); if (!n.이름) return;
    await put(`people/${x.id}`, n); };
  $("dlg").returnValue = ""; $("dlg").showModal();
}

const askErr = e => ({not_granted: "Claude 사용이 허용되지 않았습니다.", rate_limited: "요청이 많습니다. 잠시 후 다시 눌러 주세요.", prompt_too_large: "자료가 너무 깁니다. 과업범위를 줄여 주세요."}[e?.code] || "답을 받지 못했습니다. 다시 눌러 주세요.");
const mcpMsg = e => ({needs_reauth: "연결이 만료되었습니다. claude.ai 설정 → 커넥터에서 다시 연결해 주세요.", server_not_connected: "커넥터가 연결되어 있지 않습니다.", not_in_manifest: "이 페이지에 허용되지 않았습니다.", tool_error: "요청이 거절되었습니다" + (e?.message ? `: ${e.message.slice(0, 120)}` : "")}[e?.code] || "실패했습니다" + (e?.message ? `: ${e.message.slice(0, 120)}` : ""));
async function saveXlsx(name, sheets) {
  if (!window.XLSX || !downloads) { alert("이 화면에서는 파일 저장을 쓸 수 없습니다."); return; }
  const wb = XLSX.utils.book_new(); sheets.forEach(([n, aoa]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), n));
  try { await downloads.save({filename: name, data: new Uint8Array(XLSX.write(wb, {type: "array", bookType: "xlsx"}))}); } catch {}
}
document.addEventListener("click", async e => {
  const t = e.target.closest("button, tr.click"); if (!t || (t.tagName === "TR" && e.target.closest("select, input, a"))) return;
  if (t.dataset.themeM) applyTheme(t.dataset.themeM);
  if (t.dataset.tab) showTab(t.dataset.tab);
  if (t.id === "pNew") { if (!db) return; const id = "PM" + Date.now().toString(36); projects.push({id, 이름: "새 프로젝트", 상태: "준비"}); cur = id; try { localStorage.setItem("pmo-proj", id); } catch {} await saveProj(P()); showTab("set"); }
  if (t.id === "pSave") { const p = P(); document.querySelectorAll("[data-pf]").forEach(el => p[el.dataset.pf] = el.value.trim()); p.계약금액 = num(p.계약금액); p.tasksListName = tlists?.find(x => x[0] === p.tasksList)?.[1] || p.tasksListName || ""; if (await saveProj(p, $("pNote"))) { setDirty = null; pMsg = "저장했습니다."; } drawTop(); }
  if (t.id === "pDel") { const p = P(); if (!confirm(`'${p.이름}'을 삭제할까요? 공정·예산도 함께 지워집니다(장부는 남습니다).`)) return; await Promise.all([`pm/${p.id}`, `wbs/${p.id}`, `budget/${p.id}`].map(x => db.doc(x).delete().catch(() => {}))); cur = null; draw(); }
  if (t.id === "loadLists") loadLists();
  if (t.id === "genWbs") genWbs();
  if (t.id === "addTask") editTask(null);
  if (t.id === "chkLate") checkLate();
  if (t.dataset.t !== undefined) editTask(+t.dataset.t);
  if (t.id === "wbsCsv") saveXlsx(`CHRONOS_공정표_${P().이름}_${today()}.xlsx`, [["공정표", [["ID", "단계", "작업", "산출물", "시작", "종료", "담당", "상태", "메모", "원인", "해결방안"], ...W().map(x => [x.id, x.단계, x.작업, x.산출물, x.시작, x.종료, who(x), effStat(x), x.메모, x.원인, x.해결])]]]);
  if (t.id === "budPick") $("budFile").click();
  if (t.id === "bCommit") budCommit();
  if (t.id === "bCancel") { bup = null; $("bStage").innerHTML = ""; }
  if (t.id === "budXlsx") { const b = B(), m = money(); saveXlsx(`LEDGER_예산_${P().이름}_${today()}.xlsx`, [["예산", [[...b.head, "과세/영세", "집행예정", "집행", "장부 합계", "잔액"], ...b.rows.map(r => r.제목행 ? r.cells : [...r.cells, r.과세, r.예정, r.집행, m.ledBy[r.id] || 0, num(r.금액) - (num(r.집행) || num(r.예정))]),
    [], ["계약(공급가)", m.계약], ["예산 합계", m.예산], ["과세 예산", m.과세.예산, "부가세", m.과세.예산 * .1], ["영세 예산", m.영세.예산], ["집행예정", m.예정], ["집행", m.집행], ["예상 수익률(%)", m.예상수익률?.toFixed(1)], ["확정 수익률(%)", m.확정수익률?.toFixed(1)]]]]); }
  if (t.id === "ledAdd") editLed(null);
  if (t.dataset.le) editLed(ledger.find(x => x.id === t.dataset.le));
  if (t.id === "ledXlsx") saveXlsx(`LEDGER_장부_${today()}.xlsx`, [["장부", [["일자", "프로젝트", "예산 항목", "거래처", "적요", "과세/영세", "공급가액", "부가세", "합계", "증빙", "메모"], ...ledger.map(x => [x.일자, projects.find(p => p.id === x.pid)?.이름 || x.pid, x.항목, x.거래처, x.적요, x.과세, x.공급가액, x.부가세, x.합계, x.증빙, x.메모])]]]);
  if (t.id === "pplAdd") editPpl(null);
  if (t.dataset.pp) editPpl(people.find(x => x.id === t.dataset.pp));
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.pf) setDirty = cur;
  if (t.id === "pSel") { setDirty = null; pMsg = ""; cur = t.value; try { localStorage.setItem("pmo-proj", cur); } catch {} draw(); }
  if (t.id === "fromDec") { const c = D.decoder.find(x => x.bidNtceNo === t.value); if (!c) return; setDirty = cur; const ta = document.querySelector('[data-pf="과업범위"]');
    ta.value = [`[${c.사업명}] ${c.한줄요약}`, ...c.과업범위.map(s => `- ${s.영역}: ${s.내용}`), "", "[주요 일정]", ...c.일정.map(x => `- ${x.날짜} ${x.항목}`)].join("\n");
    const nm = document.querySelector('[data-pf="이름"]'); if (nm.value === "새 프로젝트") nm.value = c.사업명; const bz = document.querySelector('[data-pf="발주처"]'); if (!bz.value) bz.value = c.발주기관; }
  if (t.id === "budFile" && t.files[0]) { const f = t.files[0]; if (!window.XLSX) { alert("엑셀 읽기 도구를 불러오지 못했습니다."); return; } const buf = await f.arrayBuffer(); budLoad(f.name, XLSX.read(buf, {type: "array"})); }
  if (t.id === "bSheet") { bup.sheet = t.value; budGuess(); budStage(); }
  if (t.id === "bHr") { bup.hr = Math.max(0, +t.value - 1); budStage(); }
  if (t.dataset.bm) { bup.map[t.dataset.bm] = t.value === "" ? -1 : +t.value; }
  if (t.dataset.bf) { const [i, k] = t.dataset.bf.split("|"), r = B().rows[+i]; r[k] = k === "과세" ? t.value : num(t.value); await saveBud(); drawTop(); drawBud(); }
  if (t.id === "lScope") { lf.scope = t.value; drawLed(); } if (t.id === "lTax") { lf.tax = t.value; drawLed(); }
});
document.addEventListener("input", e => { if (e.target.dataset.pf) { setDirty = cur; pMsg = ""; } if (e.target.id === "lq") { lf.q = e.target.value; const pos = e.target.selectionStart; drawLed(); $("lq").focus(); $("lq").setSelectionRange(pos, pos); } });

showTab(tab);
(async () => {
  [db, sample, mcp, downloads] = await Promise.all(["db", "sample", "mcp", "downloads"].map(n => window.claude?.use?.(n) ?? null));
  if (!db) { draw(); return; }
  db.collection("pm").onSnapshot(s => { const local = projects.filter(p => !s.docs.some(d => d.id === p.id) && !p.updatedAt); projects = [...s.docs.map(d => ({id: d.id, ...d.data()})), ...local]; if (!P() && projects[0]) cur = projects[0].id; draw(); });
  db.collection("wbs").onSnapshot(s => { wbs = {}; s.docs.forEach(d => wbs[d.id] = d.data()); draw(); });
  db.collection("budget").onSnapshot(s => { budget = {}; s.docs.forEach(d => budget[d.id] = d.data()); if (tab !== "bud" || !document.activeElement?.dataset?.bf) draw(); });
  db.collection("ledger").onSnapshot(s => { ledger = s.docs.map(d => ({id: d.id, ...d.data()})); if (tab !== "led" || document.activeElement?.id !== "lq") draw(); });
  db.collection("people").onSnapshot(s => { people = s.docs.map(d => ({id: d.id, ...d.data()})); draw(); });
})();
