<title>사업 수행 관제실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>

:root{
  color-scheme:dark;
  --bg:#060C13;--bg2:#0A1622;--glass:rgba(16,34,50,.72);--glass2:rgba(22,46,66,.55);--ink:#DDF3FA;--muted:#7F9CAB;--line:rgba(88,200,235,.22);
  --holo:#38D5F0;--holo-ink:#04121A;--holo-soft:rgba(56,213,240,.14);--amber:#F5B942;--amber-soft:rgba(245,185,66,.14);
  --go:#4BE3A0;--go-soft:rgba(75,227,160,.14);--stop:#FF7A7A;--grid:rgba(56,213,240,.07);
  --oc1:#0B2A3C;--oc2:#050D15;--landc:#16384C;--landhas:#1F5670;--t1:#38D5F0;--t2:#F5B942;--t3:#4BE3A0;--t4:#B18CFF;--t5:#FF8FB8;--t6:#7FA8FF;
  --hud:"Chakra Petch","IBM Plex Sans KR",ui-monospace,monospace;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#E4ECF1;--bg2:#D6E2EA;--glass:rgba(255,255,255,.8);--glass2:rgba(240,247,250,.9);--ink:#0E2230;--muted:#557080;--line:rgba(10,110,140,.22);
  --holo:#0A7FA0;--holo-ink:#FFFFFF;--holo-soft:rgba(10,127,160,.1);--amber:#A56A06;--amber-soft:rgba(165,106,6,.1);
  --go:#127A4E;--go-soft:rgba(18,122,78,.1);--stop:#B3332B;--grid:rgba(10,127,160,.08);
  --oc1:#F4FAFD;--oc2:#CFE3EC;--landc:#B9CFDA;--landhas:#8FB6C8;--t1:#0A7FA0;--t2:#B07406;--t3:#127A4E;--t4:#6B45C9;--t5:#C23F76;--t6:#2F5FC4;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#E4ECF1;--bg2:#D6E2EA;--glass:rgba(255,255,255,.8);--glass2:rgba(240,247,250,.9);--ink:#0E2230;--muted:#557080;--line:rgba(10,110,140,.22);
  --holo:#0A7FA0;--holo-ink:#FFFFFF;--holo-soft:rgba(10,127,160,.1);--amber:#A56A06;--amber-soft:rgba(165,106,6,.1);
  --go:#127A4E;--go-soft:rgba(18,122,78,.1);--stop:#B3332B;--grid:rgba(10,127,160,.08);--oc1:#F4FAFD;--oc2:#CFE3EC;--landc:#B9CFDA;--landhas:#8FB6C8;--t1:#0A7FA0;--t2:#B07406;--t3:#127A4E;--t4:#6B45C9;--t5:#C23F76;--t6:#2F5FC4;}}
body{color:var(--ink);font:15px/1.6 var(--sans);padding-inline:16px;padding-block:16px 56px;min-height:100%;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px,radial-gradient(1200px 600px at 30% 0%,var(--bg2),var(--bg)) fixed,var(--bg)}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hudlabel{font:500 11px var(--hud);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px}
.bar .where{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.live{width:8px;height:8px;border-radius:50%;background:var(--go);box-shadow:0 0 10px var(--go);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.clock{font:700 15px var(--hud);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);font:500 12px var(--sans);padding:5px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--holo);color:var(--holo-ink)}
.btn{font:500 13px var(--sans);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:5px 12px;cursor:pointer;white-space:nowrap;transition:border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--holo);box-shadow:0 0 12px var(--holo-soft)}
.btn.primary{background:var(--go);color:var(--holo-ink);border-color:var(--go)}
.btn.x{color:var(--muted)}
.btn.x:hover{color:var(--stop);border-color:var(--stop)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
.note{font-size:12px;color:var(--muted);margin:0}
.warn{color:var(--amber)}
.err{color:var(--stop)}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes land{from{transform:translateY(8px);opacity:0}}
.hero{display:flex;gap:16px;align-items:center;padding:16px 18px;flex-wrap:wrap}
.hero img{width:96px;height:96px;animation:bob 4s ease-in-out infinite}
.hero h1{margin:0;font:700 34px/1 var(--hud);letter-spacing:.14em;color:var(--holo);text-shadow:0 0 18px var(--holo-soft)}
.hero .r{font-weight:500;margin-top:4px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:92px;background:var(--glass2)}
.kpi b{display:block;font:700 22px var(--hud);color:var(--holo);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:999px;padding:8px 18px;cursor:pointer;font:500 14px var(--sans)}
.tabs button[aria-selected="true"]{background:var(--holo);color:var(--holo-ink);border-color:var(--holo)}
.panel{padding:18px;display:flex;flex-direction:column;gap:14px;animation:land .3s ease-out}
.panel[hidden]{display:none}
.panel h2{margin:0;font:700 16px var(--sans)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.plist{display:flex;flex-direction:column;gap:6px}
.plist button{text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;font:14px var(--sans)}
.plist button[aria-pressed="true"]{border-color:var(--holo);background:var(--holo-soft)}
.plist small{display:block;color:var(--muted);font-size:12px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form .wide{grid-column:1/-1}
input,select,textarea{font:14px var(--sans);color:var(--ink);background:var(--glass2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;box-sizing:border-box}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--holo);box-shadow:0 0 12px var(--holo-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{flex-direction:row;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink);font-size:13px;cursor:pointer}
.chips input{accent-color:var(--holo)}
details.fold>summary{cursor:pointer;list-style:none;font-weight:500}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";display:inline-block;margin-right:8px;color:var(--holo);transition:transform .2s}
details.fold[open]>summary::before{transform:rotate(90deg)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:500 11px var(--hud);letter-spacing:.04em;color:var(--muted);background:var(--glass2);position:sticky;top:0;white-space:nowrap}
tbody tr:hover{background:var(--holo-soft)}
tbody tr.click{cursor:pointer}
td{word-break:keep-all}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11px;color:var(--muted);white-space:nowrap}
.tag.go{color:var(--go);border-color:var(--go)}
.tag.amber{color:var(--amber);border-color:var(--amber)}
.co{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--glass2)}
.co h3{margin:0;font-size:15px}
.m{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:start;border-top:1px dashed var(--line);padding-top:8px}
.score{font:700 20px var(--hud);color:var(--go);text-align:center}
.sbar{display:block;height:4px;border-radius:2px;background:var(--line);margin-top:2px}
.sbar i{display:block;height:100%;border-radius:2px;background:var(--go)}
.why{font-size:13px;color:var(--muted)}
.out{white-space:pre-wrap;word-break:break-word;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--glass2);font-size:14px;line-height:1.7}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);transition:border-color .2s,background .2s}
.drop.on{border-color:var(--holo);background:var(--holo-soft);color:var(--ink)}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.steps span{border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.steps span.on{border-color:var(--holo);color:var(--holo)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg2);color:var(--ink);max-width:760px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.55)}
@media (max-width:860px){.geo{grid-template-columns:1fr}}
.chk{flex-direction:row!important;align-items:center;gap:3px;white-space:nowrap;color:var(--ink)!important}
.co.disc{border-color:var(--holo);box-shadow:0 0 18px var(--holo-soft)}
.co.disc .co{background:var(--glass)}
.empty{font-size:13px;color:var(--muted);padding:6px 0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
<style>
.pbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px}
.pbar select{min-width:200px;max-width:100%}
.pbar label{max-width:100%}
.kp{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.kp div{border:1px solid var(--line);border-radius:10px;padding:4px 10px;background:var(--glass2);min-width:84px}
.kp b{display:block;font:700 16px var(--hud);font-variant-numeric:tabular-nums;color:var(--holo)}
.kp .hot b{color:var(--go)}
.kp .bad b{color:var(--stop)}
.duo{display:flex;gap:14px;flex-wrap:wrap}
.duo .who{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--glass2)}
.duo img{width:56px;height:56px}
.duo b{font:700 18px var(--hud);letter-spacing:.1em;color:var(--holo)}
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.gantt table{border-collapse:collapse;min-width:100%;font-size:12px}
.gantt th,.gantt td{border-bottom:1px solid var(--line);padding:4px 6px;white-space:nowrap}
.gantt td.task{min-width:220px;max-width:320px;white-space:normal}
.gantt .wk{min-width:34px;text-align:center;color:var(--muted);font-weight:400;border-left:1px dashed var(--line)}
.gantt .cell{padding:0;border-left:1px dashed var(--line);position:relative;height:30px}
.gantt .bar{position:absolute;top:8px;height:14px;border-radius:7px;background:var(--holo)}
.gantt .bar.완료{background:var(--go)}
.gantt .bar.지연{background:var(--stop)}
.gantt .bar.대기{background:var(--muted);opacity:.6}
.gantt .bar.검토{background:var(--amber)}
.gantt .today{position:absolute;top:0;bottom:0;width:2px;background:var(--amber)}
.gantt tr.click:hover td{background:var(--holo-soft)}
.st{display:inline-block;border-radius:999px;padding:0 8px;font-size:11px;border:1px solid var(--line)}
.st.완료{color:var(--go);border-color:var(--go)}
.st.지연{color:var(--stop);border-color:var(--stop)}
.st.요청,.st.진행{color:var(--holo);border-color:var(--holo)}
.st.검토{color:var(--amber);border-color:var(--amber)}
.bt td input,.bt td select{width:100%;min-width:90px;padding:3px 6px;font-size:12px}
.bt tr.head td{font-weight:700;background:var(--glass2)}
.bt td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bt .warn td{background:var(--amber-soft)}
.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sum>div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--glass2)}
.sum b{display:block;font:700 17px var(--hud);font-variant-numeric:tabular-nums}
.big{font:700 34px var(--hud);color:var(--go)}
@media (max-width:700px){.pbar{position:static}}
.gantt tr.sub td{font-size:11px;color:var(--muted);height:22px}
.gantt tr.sub td.task{padding-left:22px}
.gantt .dot{position:absolute;top:6px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--holo)}
.gantt .dot.완료{background:var(--go)}
.gantt .dot.지연{background:var(--stop)}
.alarm{border:1px solid var(--stop);border-radius:10px;padding:8px 12px;color:var(--stop);background:rgba(255,122,122,.08);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.subs{display:flex;flex-direction:column;gap:6px}
.subs .srow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,150px) 132px auto;gap:6px;align-items:center}
@media (max-width:600px){.subs .srow{grid-template-columns:auto minmax(0,1fr) auto}.subs .srow select,.subs .srow input[type=date]{grid-column:2/3}}
.rep{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.rep.done{opacity:.6}
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.flow button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:3px 10px;font:500 12px var(--sans);cursor:pointer}
.flow button.done{color:var(--go);border-color:var(--go)}
.flow button.on{color:var(--holo-ink);background:var(--holo);border-color:var(--holo)}
.flow i{color:var(--muted);font-style:normal}
.hb{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13px}
.hbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.hbar i{display:block;height:100%;background:var(--holo)}.hbar i.go{background:var(--go)}.hbar i.amber{background:var(--amber)}
.lv.양호{color:var(--go)}.lv.주의{color:var(--amber)}.lv.위험{color:var(--stop)}
.sheet table{border-collapse:separate;border-spacing:0}
.sheet th,.sheet td{border-right:1px solid var(--line)}
.sheet tbody tr:not(.head):nth-child(even) td{background:var(--holo-soft)}
.sheet tr.head{cursor:pointer}.sheet tr.head td:first-child::before{content:"▾ ";color:var(--holo)}.sheet tr.head.shut td:first-child::before{content:"▸ "}.sheet tr.head.total{cursor:default}.sheet tr.head.total td:first-child::before{content:""}
.sheet td input{border-radius:4px;text-align:right;font-variant-numeric:tabular-nums}
.sheet td input:focus{outline:2px solid var(--holo);outline-offset:-1px}
body.staff .adm{display:none!important} /* 팀장(비관리자): 쓰기·금액 컨트롤 숨김 — 실제 차단은 db 규칙 */
.ext{border:1px solid var(--holo);border-radius:12px;padding:10px 12px;background:var(--holo-soft);font-size:13px}
</style>

<div class="wrap">
  <header class="glass bar">
    <div class="where"><span class="live" aria-hidden="true"></span><span class="hudlabel">JARVIS OPS</span><span>사업 수행 본부 · 사업 수행 관제실</span></div>
    <div class="where"><span class="clock" id="clock">--:--:--</span><span class="hudlabel">KST</span>
      <div class="seg" role="group" aria-label="화면 모드"><button type="button" data-theme-m="system">시스템</button><button type="button" data-theme-m="light">라이트</button><button type="button" data-theme-m="dark">다크</button></div>
    </div>
  </header>

  <section class="glass hero">
    <div class="duo"><div class="who"><img src="__AV_CHRONOS__" alt=""><div><b>CHRONOS</b><div class="note">공정일정 관리자</div></div></div><div class="who"><img src="__AV_LEDGER__" alt=""><div><b>LEDGER</b><div class="note">예산 관리자</div></div></div></div>

    <label class="note">프로젝트 <select id="pSel"></select></label><button class="btn adm" type="button" id="pNew">+ 새 프로젝트</button>

  <section class="glass panel" id="tab-bud" hidden></section>
  <section class="glass panel" id="tab-led" hidden></section>
  <section class="glass panel" id="tab-ppl" hidden></section>
</div>

<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
const kst = s => s ? new Date(s).toLocaleString("sv-SE", {timeZone: "Asia/Seoul"}).slice(0, 16) : ""; // 저장은 UTC(ISO), 화면은 한국 시간
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const opt = (list, v, blank) => (blank !== undefined ? `<option value="">${blank}</option>` : "") + list.map(x => Array.isArray(x) ? `<option value="${esc(x[0])}"${x[0] === v ? " selected" : ""}>${esc(x[1])}</option>` : `<option${x === v ? " selected" : ""}>${esc(x)}</option>`).join("");
const won = n => (Math.round(+n || 0)).toLocaleString("ko-KR");
const num = v => +String(v ?? "").replace(/[^\d.\-]/g, "") || 0;
const today = () => new Date().toLocaleDateString("sv-SE", {timeZone: "Asia/Seoul"});
const applyTheme = m => { if (m === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = m;
  document.querySelectorAll("[data-theme-m]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeM === m)); try { localStorage.setItem("pmo-theme", m); } catch {} };
let th = "system"; try { th = localStorage.getItem("pmo-theme") || "system"; } catch {} applyTheme(th);
const tick = () => $("clock").textContent = new Date().toLocaleTimeString("en-GB", {hour12: false, timeZone: "Asia/Seoul"}); tick(); setInterval(tick, 1000);

const STAT = ["대기", "요청", "진행", "검토", "완료", "지연"];
const TAX = ["과세", "영세"];
let db = null, sample = null, mcp = null, downloads = null, admin = null; // admin: null=확인 전, false=팀장(공정·지표만)
let projects = [], people = [], wbs = {}, budget = {}, ledger = [], cur = null, tab = "wbs";
try { cur = localStorage.getItem("pmo-proj"); tab = localStorage.getItem("pmo-tab") || "wbs"; } catch {}
const P = () => projects.find(p => p.id === cur);
const W = () => (wbs[cur]?.items) || [];
const B = () => budget[cur];
const L = () => ledger.filter(e => e.pid === cur);
