<style>

  --oc1:#F4FAFD;--oc2:#CFE3EC;--landc:#B9CFDA;--landhas:#8FB6C8;--t1:#0A7FA0;--t2:#B07406;--t3:#127A4E;--t4:#6B45C9;--t5:#C23F76;--t6:#2F5FC4;
}

  --holo:#0A7FA0;--holo-ink:#FFFFFF;--holo-soft:rgba(10,127,160,.1);--amber:#A56A06;--amber-soft:rgba(165,106,6,.1);

  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px,radial-gradient(1200px 600px at 30% 0%,var(--bg2),var(--bg)) fixed,var(--bg)}

.note{font-size:12px;color:var(--muted);margin:0}

@keyframes bob{50%{transform:translateY(-4px)}}

.tabs{display:flex;gap:8px;flex-wrap:wrap}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px}

table{border-collapse:collapse;width:100%;font-size:13px}

dialog.side{margin:0 0 0 auto;height:100%;max-height:100%;max-width:560px;width:100%;box-sizing:border-box;border-radius:0;border-width:0 0 0 1px;overflow:auto}

.chk{flex-direction:row!important;align-items:center;gap:3px;white-space:nowrap;color:var(--ink)!important}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>

.ev{border:0;border-radius:4px;padding:1px 4px;font:11px var(--sans);text-align:left;background:var(--holo-soft);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;max-width:100%}

const sj = v => JSON.stringify(v, (k, x) => x && typeof x === "object" && !Array.isArray(x) ? Object.fromEntries(Object.entries(x).sort()) : x);
let views = {};
// ponytail: 관리자가 관제실을 열 때 사본 갱신 — 늦으면 루틴으로
function syncView() {
  const want = {};
  projects.forEach(p => want[p.id] = {...pick(p, ["이름", "코드", "발주처", "상태", "시작", "종료", "연락처페이지"]), 담당PM: String(people.find(x => x.id === p.PM)?.이름 ?? ""), PM: String(p.PM ?? ""),
    인력: people.filter(x => !x.pid || x.pid === p.id).map(x => pick(x, ["id", "이름", "직책", "역할", "참여시작", "참여종료", "uid"])).sort((a, b) => a.id.localeCompare(b.id))});
  Object.entries(want).forEach(([id, v]) => { if (sj(v) !== sj(views[id] ?? null)) { views[id] = v; db.doc(`view/${id}`).set(v).catch(() => {}); } });
  Object.keys(views).filter(id => !want[id]).forEach(id => { delete views[id]; db.doc(`view/${id}`).delete().catch(() => {}); });
}

showTab(tab);
(async () => {
  let user; [db, sample, mcp, downloads, user] = await Promise.all(["db", "sample", "mcp", "downloads", "user"].map(n => window.claude?.use?.(n) ?? null));
  uid = (await user?.id?.().catch(() => null)) ?? null;
  admin = !!user && ((await user.isOwner?.().catch(() => false)) || (await user.canEdit?.().catch(() => false)));
  document.body.classList.toggle("staff", !admin); showTab(tab);
  if (!db) { draw(); return; }
  const got = new Set(), ready = k => { got.add(k); if (got.size === 2 && !got.has("done")) { got.add("done"); setTimeout(() => lateAlert(false), 500); } }; // 프로젝트·공정이 모두 들어온 뒤 한 번
  // 같은 작업(id)은 같은 객체를 유지한다 — 열린 창·AI 작업 중인 작업이 새 스냅샷에 끊기지 않게
  db.collection("wbs").onSnapshot(s => { const old = wbs, now = Date.now(); wbs = {}; s.docs.forEach(d => { const v = structuredClone(d.data()), prev = old[d.id]?.items || [], pd = wPend[d.id];
    if (pd) { if ((pd.j === sj(v.items || []) && pd.t <= pd.s) || now - pd.t > 15000) delete wPend[d.id]; else if (old[d.id]) { wbs[d.id] = old[d.id]; return; } } // 내 저장이 돌아오기 전 스냅샷은 건너뜀
    v.items = (v.items || []).map(it => { const o = prev.find(x => x.id === it.id); if (!o) return it; Object.keys(o).forEach(k => delete o[k]); return Object.assign(o, it); }); wbs[d.id] = v; });
    Object.keys(wPend).forEach(id => { if (!wbs[id] && old[id] && now - wPend[id].t <= 15000) wbs[id] = old[id]; }); draw(); ready("wbs"); });
  db.collection("files").onSnapshot(s => { files = s.docs.map(d => ({id: d.id, ...structuredClone(d.data())})); if (dlgT) drawAtt(); }, () => {});
  const akSub = (c, set) => db.collection(c).onSnapshot(s => { set(Object.fromEntries(s.docs.map(d => [d.id, structuredClone(d.data())]))); if (tab === "wbs") draw(); }, () => {}); // drawWbs 가 입력 중 다시 그리기를 미룬다
  akSub("askq", v => { askQ = v; askOK = true; }); akSub("askr", v => askR = v);
  db.collection("pcon").onSnapshot(s => { pcon = s.docs.map(d => ({id: d.id, ...structuredClone(d.data())})); if (tab === "ct") drawCt(); }, () => {});
  db.collection("peoplereq").onSnapshot(s => { preqs = s.docs.map(d => ({id: d.id, ...structuredClone(d.data())})); if (tab === "ppl") draw(); }, () => {});
  if (!admin) { // 팀장: pm·people·budget·ledger 는 읽지 않고(db 규칙상 거부) 사본만
    db.collection("view").onSnapshot(s => { projects = s.docs.map(d => ({id: d.id, ...structuredClone(d.data())})); people = projects.flatMap(p => (p.인력 || []).map(x => ({...x, pid: p.id})));
      if (!P() && projects[0]) cur = projects[0].id; draw(); ready("pm"); }, () => { $("say").textContent = "관제실 자료를 불러오지 못했습니다. 새로고침해 주세요."; });
    return;
  }
  const seen = new Set(), sync = k => { seen.add(k); if (seen.size === 3) syncView(); }; // pm·people·view 가 모두 들어온 뒤부터
  db.collection("pm").onSnapshot(s => { const local = projects.filter(p => !s.docs.some(d => d.id === p.id) && !p.updatedAt); projects = [...s.docs.map(d => ({id: d.id, ...structuredClone(d.data())})), ...local]; if (!P() && projects[0]) cur = projects[0].id; draw(); ready("pm"); sync("pm"); });
  db.collection("budget").onSnapshot(s => { budget = {}; s.docs.forEach(d => budget[d.id] = structuredClone(d.data())); draw(); });
  db.collection("ledger").onSnapshot(s => { ledger = s.docs.map(d => ({id: d.id, ...structuredClone(d.data())})); draw(); }); // drawLed 가 입력 중 다시 그리기를 미룬다
  db.collection("staff").onSnapshot(s => { staff = s.docs.map(d => ({id: d.id, ...structuredClone(d.data())})); if (tab === "ppl") { if (document.activeElement?.id === "stQ") drawSt(); else draw(); } }, () => {});
  db.collection("people").onSnapshot(s => { people = s.docs.map(d => ({id: d.id, ...structuredClone(d.data())})); draw(); sync("people"); });
  db.collection("view").onSnapshot(s => { const first = !seen.has("view"); views = {}; s.docs.forEach(d => views[d.id] = structuredClone(d.data())); if (first) sync("view"); }, () => {}); // 쓰는 중 스냅샷마다 다시 쓰지 않게 첫 번만
})();
</script>
