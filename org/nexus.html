<title>NEXUS 매칭 센터</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#060C13;--bg2:#0A1622;--glass:rgba(16,34,50,.72);--glass2:rgba(22,46,66,.55);--ink:#DDF3FA;--muted:#7F9CAB;--line:rgba(88,200,235,.22);
  --holo:#38D5F0;--holo-ink:#04121A;--holo-soft:rgba(56,213,240,.14);--amber:#F5B942;--amber-soft:rgba(245,185,66,.14);
  --go:#4BE3A0;--go-soft:rgba(75,227,160,.14);--stop:#FF7A7A;--grid:rgba(56,213,240,.07);
  --oc1:#0B2A3C;--oc2:#050D15;--landc:#16384C;--landhas:#1F5670;--t1:#38D5F0;--t2:#F5B942;--t3:#4BE3A0;--t4:#B18CFF;--t5:#FF8FB8;--t6:#7FA8FF;
  --hud:"Chakra Petch","IBM Plex Sans KR",ui-monospace,monospace;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#E4ECF1;--bg2:#D6E2EA;--glass:rgba(255,255,255,.8);--glass2:rgba(240,247,250,.9);--ink:#0E2230;--muted:#557080;--line:rgba(10,110,140,.22);
  --holo:#0A7FA0;--holo-ink:#FFFFFF;--holo-soft:rgba(10,127,160,.1);--amber:#A56A06;--amber-soft:rgba(165,106,6,.1);
  --go:#127A4E;--go-soft:rgba(18,122,78,.1);--stop:#B3332B;--grid:rgba(10,127,160,.08);
  --oc1:#F4FAFD;--oc2:#CFE3EC;--landc:#B9CFDA;--landhas:#8FB6C8;--t1:#0A7FA0;--t2:#B07406;--t3:#127A4E;--t4:#6B45C9;--t5:#C23F76;--t6:#2F5FC4;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#E4ECF1;--bg2:#D6E2EA;--glass:rgba(255,255,255,.8);--glass2:rgba(240,247,250,.9);--ink:#0E2230;--muted:#557080;--line:rgba(10,110,140,.22);
  --holo:#0A7FA0;--holo-ink:#FFFFFF;--holo-soft:rgba(10,127,160,.1);--amber:#A56A06;--amber-soft:rgba(165,106,6,.1);
  --go:#127A4E;--go-soft:rgba(18,122,78,.1);--stop:#B3332B;--grid:rgba(10,127,160,.08);--oc1:#F4FAFD;--oc2:#CFE3EC;--landc:#B9CFDA;--landhas:#8FB6C8;--t1:#0A7FA0;--t2:#B07406;--t3:#127A4E;--t4:#6B45C9;--t5:#C23F76;--t6:#2F5FC4;}}
body{color:var(--ink);font:15px/1.6 var(--sans);padding-inline:16px;padding-block:16px 56px;min-height:100%;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px,radial-gradient(1200px 600px at 30% 0%,var(--bg2),var(--bg)) fixed,var(--bg)}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hudlabel{font:500 11px var(--hud);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px}
.bar .where{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.live{width:8px;height:8px;border-radius:50%;background:var(--go);box-shadow:0 0 10px var(--go);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.clock{font:700 15px var(--hud);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);font:500 12px var(--sans);padding:5px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--holo);color:var(--holo-ink)}
.btn{font:500 13px var(--sans);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:5px 12px;cursor:pointer;white-space:nowrap;transition:border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--holo);box-shadow:0 0 12px var(--holo-soft)}
.btn.primary{background:var(--go);color:var(--holo-ink);border-color:var(--go)}
.btn.x{color:var(--muted)}
.btn.x:hover{color:var(--stop);border-color:var(--stop)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
.note{font-size:12px;color:var(--muted);margin:0}
.warn{color:var(--amber)}
.err{color:var(--stop)}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes land{from{transform:translateY(8px);opacity:0}}
.hero{display:flex;gap:16px;align-items:center;padding:16px 18px;flex-wrap:wrap}
.hero img{width:96px;height:96px;animation:bob 4s ease-in-out infinite}
.hero h1{margin:0;font:700 34px/1 var(--hud);letter-spacing:.14em;color:var(--holo);text-shadow:0 0 18px var(--holo-soft)}
.hero .r{font-weight:500;margin-top:4px}
.bubble{margin:8px 0 0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--glass2);max-width:640px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:92px;background:var(--glass2)}
.kpi b{display:block;font:700 22px var(--hud);color:var(--holo);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:999px;padding:8px 18px;cursor:pointer;font:500 14px var(--sans)}
.tabs button[aria-selected="true"]{background:var(--holo);color:var(--holo-ink);border-color:var(--holo)}
.panel{padding:18px;display:flex;flex-direction:column;gap:14px;animation:land .3s ease-out}
.panel[hidden]{display:none}
.panel h2{margin:0;font:700 16px var(--sans)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.plist{display:flex;flex-direction:column;gap:6px}
.plist button{text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;font:14px var(--sans)}
.plist button[aria-pressed="true"]{border-color:var(--holo);background:var(--holo-soft)}
.plist small{display:block;color:var(--muted);font-size:12px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form .wide{grid-column:1/-1}
input,select,textarea{font:14px var(--sans);color:var(--ink);background:var(--glass2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;box-sizing:border-box}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--holo);box-shadow:0 0 12px var(--holo-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{flex-direction:row;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink);font-size:13px;cursor:pointer}
.chips input{accent-color:var(--holo)}
details.fold>summary{cursor:pointer;list-style:none;font-weight:500}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";display:inline-block;margin-right:8px;color:var(--holo);transition:transform .2s}
details.fold[open]>summary::before{transform:rotate(90deg)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:500 11px var(--hud);letter-spacing:.04em;color:var(--muted);background:var(--glass2);position:sticky;top:0;white-space:nowrap}
tbody tr:hover{background:var(--holo-soft)}
tbody tr.click{cursor:pointer}
td{word-break:keep-all}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.matrix td.num button{border:0;background:transparent;color:var(--holo);font:500 13px var(--sans);cursor:pointer;padding:0}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11px;color:var(--muted);white-space:nowrap}
.tag.go{color:var(--go);border-color:var(--go)}
.tag.amber{color:var(--amber);border-color:var(--amber)}
.co{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--glass2)}
.co h3{margin:0;font-size:15px}
.m{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:start;border-top:1px dashed var(--line);padding-top:8px}
.score{font:700 20px var(--hud);color:var(--go);text-align:center}
.sbar{display:block;height:4px;border-radius:2px;background:var(--line);margin-top:2px}
.sbar i{display:block;height:100%;border-radius:2px;background:var(--go)}
.why{font-size:13px;color:var(--muted)}
.out{white-space:pre-wrap;word-break:break-word;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--glass2);font-size:14px;line-height:1.7}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);transition:border-color .2s,background .2s}
.drop.on{border-color:var(--holo);background:var(--holo-soft);color:var(--ink)}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.steps span{border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.steps span.on{border-color:var(--holo);color:var(--holo)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg2);color:var(--ink);max-width:760px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.55)}
.geo{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:16px}
@media (max-width:860px){.geo{grid-template-columns:1fr}}
.stage{display:flex;flex-direction:column;gap:8px;min-width:0}
.gbar{gap:8px}
#globe{width:100%;aspect-ratio:1/1;max-height:620px;touch-action:pan-y;cursor:grab;display:block}
#globe.us{aspect-ratio:975/610;cursor:default}
#globe:active{cursor:grabbing}
.sphere{fill:url(#ocean);stroke:var(--holo);stroke-opacity:.5}
.halo{fill:none;stroke:var(--holo);stroke-opacity:.12;stroke-width:14;filter:blur(6px)}
.grat{fill:none;stroke:var(--holo);stroke-opacity:.12;stroke-width:.6}
.land{fill:var(--landc);stroke:var(--bg);stroke-width:.5;cursor:pointer;transition:fill .3s}
.land.has{fill:var(--landhas)}
.land.sel,.land:hover{fill:var(--holo-soft);stroke:var(--holo);stroke-width:1}
.land.target{stroke:var(--amber);stroke-width:1.6}
.arc{fill:none;stroke:var(--holo);stroke-linecap:round;stroke-dasharray:4 7;animation:flow 1.6s linear infinite;pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-22}}
.bub{cursor:pointer}
.bub .core{fill:var(--bg);fill-opacity:.75}
.bub text{font:700 10px var(--hud);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.bub.sel .ring{stroke:var(--ink);stroke-width:2;fill:none}
.hq{fill:var(--amber)}
.hq-ping{fill:none;stroke:var(--amber);animation:ping 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(4)}}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.gside{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--glass2);display:flex;flex-direction:column;gap:10px;min-width:0;max-height:760px;overflow-y:auto}
.gside h3{margin:0;font:700 20px var(--sans)}
.gside .big{font:700 30px var(--hud);color:var(--holo)}
.hb{display:grid;grid-template-columns:78px minmax(0,1fr) 44px;gap:6px;align-items:center;font-size:12px}
.hb span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.hb b{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.hb b i{display:block;height:100%;border-radius:4px}
.rank button{display:grid;grid-template-columns:22px 1fr auto;gap:6px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:4px 2px;cursor:pointer;font:13px var(--sans);border-bottom:1px dashed var(--line)}
.rank button:hover{color:var(--holo)}
.ppl button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 8px;margin-bottom:5px;cursor:pointer;font:13px var(--sans)}
.ppl button:hover{border-color:var(--holo)}
.empty{font-size:13px;color:var(--muted);padding:6px 0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>

<div class="wrap">

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="proj" aria-selected="true">프로젝트 매칭</button>
    <button type="button" role="tab" data-tab="db" aria-selected="false">네트워크 DB</button>

  </nav>

  <!-- 프로젝트 -->
  <section class="glass panel" id="tab-proj">
    <div class="grid2">
      <div class="plist"><div class="hudlabel">프로젝트</div><div class="plist" id="plist"></div><button class="btn" type="button" id="newProj">+ 새 프로젝트</button></div>
      <div id="pview" style="display:flex;flex-direction:column;gap:14px"></div>
    </div>
  </section>

  <!-- 네트워크 DB -->
  <section class="glass panel" id="tab-db" hidden>
    <div class="row">
      <input id="q" type="search" placeholder="이름·회사·키워드·이메일 검색" style="flex:1;min-width:200px">
      <select id="fType"></select><select id="fInd"></select><select id="fCountry"></select><select id="fYear"></select><select id="fStage"></select>
      <button class="btn x" type="button" id="fReset">초기화</button>
    </div>
    <div class="geo">
      <div class="stage">
        <div class="row gbar"><div class="seg" role="group" aria-label="지도"><button type="button" data-view="globe">지구본</button><button type="button" data-view="us">미국 주별</button></div>
          <select id="gProj" aria-label="프로젝트 보기"></select><button class="btn" type="button" id="gSpin"></button><span class="note" id="gHint"></span></div>
        <svg id="globe" role="img" aria-label="네트워크 지구본"></svg>
        <div class="legend" id="legend"></div>
      </div>
      <aside class="gside" id="gside" aria-live="polite"></aside>
    </div>
    <details class="fold"><summary>산업 × 유형 표 <span class="note">숫자를 누르면 그 목록만 봅니다</span></summary><div class="tw" style="margin-top:8px"><table class="matrix" id="matrix"></table></div></details>
    <div class="row"><span class="note" id="dbCount"></span><span style="flex:1"></span>
      <button class="btn" type="button" id="addContact">+ 직접 추가</button>
      <button class="btn" type="button" id="dbSheet">구글 시트로 저장</button>
      <button class="btn" type="button" id="dbCsv">CSV 저장</button></div>
    <div class="tw" style="max-height:560px;overflow-y:auto"><table id="dbTable"></table></div>
    <p class="note" id="dbNote"></p>
  </section>

  <!-- 업로드 -->
  <section class="glass panel" id="tab-up" hidden>
    <div class="steps" id="steps"><span class="on">① 자료 선택</span><span>② NEXUS가 열 맞춤</span><span>③ 확인 후 추가</span></div>
    <div class="form">
      <label>자료 종류<select id="uKind"><option value="contacts">바이어·투자자 연락처</option><option value="companies">참가기업 (프로젝트용)</option></select></label>
      <label id="uProjWrap" hidden>넣을 프로젝트<select id="uProj"></select></label>
      <label>취합 연도 (필수)<input id="uYear" inputmode="numeric" maxlength="4" placeholder="예) 2026"></label>
      <label>출처 (행사·사업명)<input id="uSrc" placeholder="예) CES 2027 바이어 리스트"></label>
    </div>
    <div class="drop" id="drop">엑셀(.xlsx·.xls)·CSV 파일을 여기로 끌어다 놓거나 <button class="btn" type="button" id="pick">파일 선택</button><input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
      <div class="row" style="justify-content:center;margin-top:10px"><input id="gLink" placeholder="또는 구글 시트·드라이브 파일 링크 붙여넣기" style="width:min(460px,100%)"><button class="btn" type="button" id="gLoad">불러오기</button></div></div>
    <div id="uStage"></div>
    <details class="fold"><summary>올린 기록</summary><div id="uLog" style="margin-top:8px"></div></details>
  </section>
</div>

    else if (isNew) await addRows([n]);
    else { const i = chunks[r._c].findIndex(x => x.id === r.id); chunks[r._c][i] = {...chunks[r._c][i], ...n}; await writeChunks([r._c]); }

  };
  $("dlg").returnValue = ""; $("dlg").showModal();
}
async function addRows(rows) { // 새 연락처는 id를 붙여 마지막 묶음부터 채운다
  const touched = new Set(); let ks = Object.keys(chunks).sort(), last = ks[ks.length - 1];

    if (!last || chunks[last].length >= CHUNK) { last = "c" + String(ks.length + 1).padStart(4, "0"); chunks[last] = []; ks.push(last); }

  }
  await writeChunks([...touched]);
}

const fields = () => $("uKind").value === "companies" ? CF : F.filter(k => !["출처", "취합연도", "원본파일"].includes(k));
function guessMap() {
  const rows = up.sheets[up.sheet]; up.headerRow = Math.max(0, rows.findIndex(r => r.filter(Boolean).length >= 3)); up.map = {};
  rows[up.headerRow].forEach((h, i) => { const k = fields().find(f => SYN[f]?.test(h) || f === h); if (k && !Object.values(up.map).includes(k)) up.map[i] = k; });
  up.defaults = {유형: "바이어", 산업대: "기타", 관계단계: "미접촉", 분야대: "기타"}; up.ai = "";
}
async function aiMap() {
  const rows = up.sheets[up.sheet], btn = $("aiMap"); btn.disabled = true; btn.textContent = "NEXUS가 보는 중…";
  const kind = $("uKind").value;
  const prompt = `너는 JARVIS 네트워크 발굴·매칭팀 NEXUS다. 아래는 사용자가 올린 ${kind === "companies" ? "참가기업 명단" : "바이어·투자자 연락처 명단"}의 앞부분이다(행 번호: 셀들을 " ¦ "로 구분).
파일명: ${up.name} / 시트: ${up.sheet}
${rows.slice(0, 12).map((r, i) => `${i}: ${r.map(c => c.slice(0, 40)).join(" ¦ ")}`).join("\n")}
표준 필드: ${fields().join(", ")}
JSON만 답한다: {"headerRow": 제목행 번호, "map": {"열번호(0부터)": "표준 필드"}, ${kind === "companies" ? '"분야대": "' + INDS.join("|") + ' 중 하나(대부분 행에 맞는 기본값)"' : `"유형": "${TYPES.join("|")} 중 기본값", "산업대": "${INDS.join("|")} 중 기본값", "관계단계": "${STAGES.join("|")} 중 기본값(수락 명단이면 수락 등)"`}, "취합연도": "자료가 모인 연도 YYYY(모르면 빈칸)", "출처": "행사·사업명 짧게", "요약": "이 자료가 무엇인지 한 줄"}
규칙: 한 필드에 여러 열(예: First name, Last name → 이름)을 매핑해도 된다. 맞는 필드가 없는 열은 뺀다. 지어내지 않는다.`;
  try { const r = await ask(prompt);
    up.headerRow = Number.isInteger(+r.headerRow) ? +r.headerRow : up.headerRow; up.map = {};
    Object.entries(r.map || {}).forEach(([i, k]) => { if (fields().includes(k)) up.map[i] = k; });
    ["유형", "산업대", "관계단계", "분야대"].forEach(k => { if (r[k]) up.defaults[k] = r[k]; });
    if (r.취합연도 && !$("uYear").value) $("uYear").value = r.취합연도;

  } catch (e) { btn.disabled = false; btn.textContent = "NEXUS에게 열 맞춤 맡기기"; $("upNote").textContent = askErr(e); }
}
function buildRows() {
  const rows = up.sheets[up.sheet].slice(up.headerRow + 1), kind = $("uKind").value, out = [];
  for (const r of rows) {
    const o = {}; Object.entries(up.map).forEach(([i, k]) => { if (r[i]) o[k] = o[k] ? o[k] + " " + r[i] : r[i]; });
    if (kind === "companies") { if (!o.기업명) continue; if (!INDS.includes(o.분야대)) o.분야대 = up.defaults.분야대; out.push(o); continue; }
    if (!o.이름 && !o.회사 && !o.이메일) continue;
    if (!TYPES.includes(o.유형)) o.유형 = up.defaults.유형; if (!INDS.includes(o.산업대)) o.산업대 = up.defaults.산업대; if (!STAGES.includes(o.관계단계)) o.관계단계 = up.defaults.관계단계;
    o.취합연도 = $("uYear").value.trim(); o.출처 = $("uSrc").value.trim(); o.원본파일 = up.name; out.push(o);
  }
  return out;
}
function drawStage() {
  const rows = up.sheets[up.sheet], head = rows[up.headerRow] || [], kind = $("uKind").value, built = buildRows();

  const cols = [...new Set(Object.values(up.map))];
  stage(`
    <div class="row"><b>${esc(up.name)}</b>${Object.keys(up.sheets).length > 1 ? `<label class="note">시트 <select id="uSheet">${opt(Object.keys(up.sheets), up.sheet)}</select></label>` : ""}<span class="note">${rows.length}행 · 제목행 ${up.headerRow + 1}번째</span></div>
    ${up.ai ? `<p class="bubble">${esc(up.ai)}</p>` : ""}
    <div class="row"><button class="btn primary" type="button" id="aiMap">NEXUS에게 열 맞춤 맡기기</button><span class="note" id="upNote">열 이름을 보고 먼저 자동으로 맞춰 두었습니다. 틀린 곳은 아래에서 고쳐 주세요.</span></div>
    <details class="fold" open><summary>열 맞춤 (원본 열 → 표준 필드)</summary>
      <div class="form" style="margin-top:8px">${head.map((h, i) => `<label>${esc(h || `(${i + 1}열)`)}<select data-map="${i}">${opt(fields(), up.map[i], "— 쓰지 않음 —")}</select></label>`).join("")}
      <label>제목행 번호<input type="number" min="1" id="uHead" value="${up.headerRow + 1}"></label>
      ${kind === "contacts" ? `<label>기본 유형<select data-def="유형">${opt(TYPES, up.defaults.유형)}</select></label><label>기본 산업<select data-def="산업대">${opt(INDS, up.defaults.산업대)}</select></label><label>기본 관계 단계<select data-def="관계단계">${opt(STAGES, up.defaults.관계단계)}</select></label>` : `<label>기본 분야<select data-def="분야대">${opt(INDS, up.defaults.분야대)}</select></label>`}</div></details>
    <div class="hudlabel">미리보기 (앞 8건)</div>
    <div class="tw"><table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}${kind === "contacts" ? "<th>유형</th><th>취합연도</th>" : ""}</tr></thead><tbody>${built.slice(0, 8).map(r => `<tr>${cols.map(c => `<td>${esc(String(r[c] || "").slice(0, 50))}</td>`).join("")}${kind === "contacts" ? `<td>${esc(r.유형)}</td><td>${esc(r.취합연도)}</td>` : ""}</tr>`).join("") || `<tr><td class="empty">열 맞춤을 확인해 주세요.</td></tr>`}</tbody></table></div>
    <div class="row"><button class="btn primary" type="button" id="commit" ${built.length ? "" : "disabled"}>${kind === "contacts" ? `${built.length - dup}명 추가${dup ? ` · 중복 ${dup}명은 빈 칸만 보충` : ""}` : `참가기업 ${built.length}곳 추가`}</button><button class="btn x" type="button" id="uCancel">취소</button><span class="note" id="cNote"></span></div>`);
}
const stage = html => $("uStage").innerHTML = html;
async function commit() {
  const kind = $("uKind").value, built = buildRows(), note = $("cNote");
  if (kind === "contacts" && !/^20\d{2}$/.test($("uYear").value.trim())) { note.textContent = "취합 연도(예: 2026)를 넣어 주세요."; $("uYear").focus(); return; }
  if (!db) { note.textContent = "이 화면에서는 저장할 수 없습니다."; return; }
  $("commit").disabled = true; note.textContent = "저장 중…"; steps(2);
  let added = 0, merged = 0;
  try {
    if (kind === "companies") {
      const p = projects.find(x => x.id === $("uProj").value); if (!p) { note.textContent = "넣을 프로젝트를 먼저 만들어 주세요."; $("commit").disabled = false; return; }
      p.companies = p.companies || []; let n = p.companies.reduce((m, x) => Math.max(m, +x.id.slice(1) || 0), 0);
      built.forEach(c => { if (!p.companies.some(x => x.기업명 === c.기업명)) { p.companies.push({id: "C" + String(++n).padStart(3, "0"), ...c}); added++; } else merged++; });
      await saveProj(p);
    } else {
      const known = new Map(contacts.map(r => [keyOf(r), r])), fresh = [], touched = new Set(), seen = new Set();
      for (const r of built) {
        const k = keyOf(r), ex = known.get(k);
        if (ex) { const row = chunks[ex._c].find(x => x.id === ex.id);
          F.forEach(f => { if (!row[f] && r[f]) row[f] = r[f]; });
          if (STAGES.indexOf(r.관계단계) > STAGES.indexOf(row.관계단계)) row.관계단계 = r.관계단계;
          if (!row.원본파일.includes(up.name)) row.원본파일 = [row.원본파일, up.name].filter(Boolean).join(" / ");
          touched.add(ex._c); merged++; }
        else if (!seen.has(k)) { seen.add(k); fresh.push(r); }
      }
      await writeChunks([...touched]); await addRows(fresh); added = fresh.length; flatten();
    }
    const log = {file: up.name, kind: kind === "contacts" ? "연락처" : "참가기업", 취합연도: $("uYear").value.trim(), 출처: $("uSrc").value.trim(), added, merged, at: new Date().toISOString()};
    await db.collection("uploads").add(log);
    stage(`<p class="bubble">본부장님, ${esc(up.name)}에서 ${added}건을 새로 넣고 ${merged}건은 기존 정보와 합쳤습니다.</p>`); up = null; drawHero();
  } catch { note.textContent = "저장 중 문제가 생겼습니다. 네트워크 DB에서 결과를 확인한 뒤 다시 시도해 주세요."; $("commit").disabled = false; }
}

// ── 이벤트

  if (t.id === "fReset") { filt = {q: "", 유형: "", 산업대: "", 국가: "", 취합연도: "", 관계단계: ""}; drawDb(); }
  if (t.dataset.ct) editContact(contacts.find(r => r.id === t.dataset.ct));
  if (t.id === "addContact") editContact(null);
  if (t.id === "dbSheet" || t.id === "dbCsv") { const rows = filtered().map(r => ["id", ...F].map(k => r[k])), head = ["ID", ...F];
    if (t.id === "dbSheet") toSheet(`JARVIS NEXUS 연락처_${today()}`, head, rows, $("dbNote")); else saveCsv(`NEXUS_연락처_${today()}.csv`, head, rows, $("dbNote")); }

  if (t.id === "gLoad") readLink();
  if (t.id === "aiMap") aiMap();

  if (t.id === "uCancel") { up = null; stage(""); steps(0); }
});
document.addEventListener("change", e => {

const drop = $("drop");

(async () => {

  db.collection("uploads").orderBy("at", "desc").limit(50).onSnapshot(s => { uploads = s.docs.map(d => d.data()); if (tab === "up") drawUpload(); });
