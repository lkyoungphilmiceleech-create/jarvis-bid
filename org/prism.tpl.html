<title>PRISM 디자인 스튜디오</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0C0814;--bg2:#160F24;--glass:rgba(30,20,48,.72);--glass2:rgba(42,28,66,.55);--ink:#F1EAFB;--muted:#A596BC;--line:rgba(190,150,255,.22);
  --holo:#C39BFF;--holo-ink:#140A22;--holo-soft:rgba(195,155,255,.15);--amber:#F5B942;--amber-soft:rgba(245,185,66,.14);
  --go:#4BE3A0;--stop:#FF7A7A;--grid:rgba(195,155,255,.06);
  --hud:"Chakra Petch","IBM Plex Sans KR",ui-monospace,monospace;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#EFEAF6;--bg2:#E3DAF0;--glass:rgba(255,255,255,.82);--glass2:rgba(248,244,253,.92);--ink:#1D1230;--muted:#6A5A82;--line:rgba(100,60,170,.2);
  --holo:#6B3FC4;--holo-ink:#FFFFFF;--holo-soft:rgba(107,63,196,.1);--amber:#A56A06;--amber-soft:rgba(165,106,6,.1);--go:#127A4E;--stop:#B3332B;--grid:rgba(107,63,196,.07);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#EFEAF6;--bg2:#E3DAF0;--glass:rgba(255,255,255,.82);--glass2:rgba(248,244,253,.92);--ink:#1D1230;--muted:#6A5A82;--line:rgba(100,60,170,.2);
  --holo:#6B3FC4;--holo-ink:#FFFFFF;--holo-soft:rgba(107,63,196,.1);--amber:#A56A06;--amber-soft:rgba(165,106,6,.1);--go:#127A4E;--stop:#B3332B;--grid:rgba(107,63,196,.07);}}
body{color:var(--ink);font:15px/1.6 var(--sans);padding-inline:16px;padding-block:16px 56px;min-height:100%;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px,radial-gradient(1200px 600px at 70% 0%,var(--bg2),var(--bg)) fixed,var(--bg)}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hudlabel{font:500 11px var(--hud);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px}
.bar .where{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.live{width:8px;height:8px;border-radius:50%;background:var(--go);box-shadow:0 0 10px var(--go)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);font:500 12px var(--sans);padding:5px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--holo);color:var(--holo-ink)}
.btn{font:500 13px var(--sans);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--holo);box-shadow:0 0 12px var(--holo-soft)}
.btn.primary{background:var(--holo);color:var(--holo-ink);border-color:var(--holo)}
.btn.x{color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
.note{font-size:12px;color:var(--muted);margin:0}
.warn{color:var(--amber)}
.hero{display:flex;gap:16px;align-items:center;padding:16px 18px;flex-wrap:wrap}
.hero img{width:96px;height:96px}
.hero h1{margin:0;font:700 34px/1 var(--hud);letter-spacing:.14em;color:var(--holo);text-shadow:0 0 18px var(--holo-soft)}
.bubble{margin:8px 0 0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--glass2);max-width:640px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:92px;background:var(--glass2)}
.kpi b{display:block;font:700 22px var(--hud);color:var(--holo)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:999px;padding:8px 18px;cursor:pointer;font:500 14px var(--sans)}
.tabs button[aria-selected="true"]{background:var(--holo);color:var(--holo-ink);border-color:var(--holo)}
.panel{padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font:700 16px var(--sans)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form .wide{grid-column:1/-1}
select{max-width:100%}
input,select,textarea{font:14px var(--sans);color:var(--ink);background:var(--glass2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;box-sizing:border-box}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{flex-direction:row;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink);font-size:13px;cursor:pointer}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11px;color:var(--muted);white-space:nowrap}
.tag.go{color:var(--go);border-color:var(--go)}
.tag.amber{color:var(--amber);border-color:var(--amber)}
.tag.stop{color:var(--stop);border-color:var(--stop)}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--glass2);display:flex;flex-direction:column;gap:8px;min-width:0;overflow-wrap:anywhere}
.card h3{margin:0;font-size:15px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card.click{cursor:pointer}
.card.click:hover,.card.sel{border-color:var(--holo);box-shadow:0 0 16px var(--holo-soft)}
.flow{display:flex;gap:4px;flex-wrap:wrap}
.flow span{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.flow span.done{background:var(--holo-soft);color:var(--holo);border-color:var(--holo)}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.ref{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--glass2);display:flex;flex-direction:column;min-width:0}
.ref .ph{position:relative;aspect-ratio:4/3;background:var(--holo-soft);display:flex;align-items:center;justify-content:center;color:var(--muted);font:700 13px var(--hud);overflow:hidden}
.ref .ph img{position:relative;width:100%;height:100%;object-fit:cover;display:block}
.ref .b{padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:13px;overflow-wrap:anywhere}
.ref.pick{outline:2px solid var(--holo)}
.gen{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.gen figure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--glass2)}
.gen img{width:100%;display:block}
.gen figcaption{padding:6px 10px;font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gen figure.kv{outline:3px solid var(--holo)}
.dir{white-space:pre-wrap;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--glass2);font-size:14px}
.empty{font-size:13px;color:var(--muted);padding:6px 0}
a{color:var(--holo)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="glass bar">
    <div class="where"><span class="live" aria-hidden="true"></span><span class="hudlabel">JARVIS OPS</span><span>사업 수행 본부 · PRISM 디자인 스튜디오</span></div>
    <div class="seg" role="group" aria-label="화면 모드"><button type="button" data-theme-m="system">시스템</button><button type="button" data-theme-m="light">라이트</button><button type="button" data-theme-m="dark">다크</button></div>
  </header>

  <section class="glass hero">
    <img src="__AVATAR__" alt="">
    <div><h1>PRISM</h1><div>디자이너 · 디자인 스튜디오</div><p class="bubble" id="say">디자인 요청을 불러오는 중입니다…</p></div>
    <div class="kpis" id="kpis"></div>
  </section>

  <nav class="tabs" role="tablist" id="tabs">
    <button type="button" role="tab" data-tab="req">디자인 요청</button>
    <button type="button" role="tab" data-tab="ref">레퍼런스 보관함</button>
    <button type="button" role="tab" data-tab="work">시안 작업</button>
  </nav>

  <section class="glass panel" id="tab-req">
    <div class="row"><h2>디자인 요청</h2><span style="flex:1"></span><button class="btn primary" type="button" id="newReq">+ 새 요청</button></div>
    <div class="seg" role="group" aria-label="상태" id="rFilt"></div>
    <div class="list" id="reqList"></div>
  </section>

  <section class="glass panel" id="tab-ref" hidden>
    <div class="row"><h2>레퍼런스 보관함</h2><span class="note">Pinterest·Behance 등 공개 자료의 링크와 미리보기만 보관합니다. 내부 참고용이며 그대로 쓰지 않습니다.</span></div>
    <div class="card"><div class="form">
      <label class="wide">링크 (Pinterest·Behance·기타)<input id="rfUrl" placeholder="https://…"></label>
      <label>이미지 주소 (선택)<input id="rfImg" placeholder="https://…jpg"></label>
      <label>제목<input id="rfTitle"></label>
      <label>태그 (쉼표로)<input id="rfTags" placeholder="미니멀, 네온, 타이포"></label>
      <label>연결할 요청<select id="rfReq"></select></label></div>
      <div class="row"><button class="btn primary" type="button" id="rfAdd">보관</button><span class="note" id="rfNote"></span></div></div>
    <div class="row"><input id="rq" type="search" placeholder="제목·태그·출처 검색" style="flex:1;min-width:180px"><select id="rSrc" aria-label="출처"></select><select id="rReq" aria-label="요청"></select></div>
    <div class="refs" id="refList"></div>
  </section>

  <section class="glass panel" id="tab-work" hidden>
    <div class="row"><label class="note">요청 <select id="wReq"></select></label></div>
    <div id="work"></div>
  </section>
</div>

<dialog id="dlg" style="border:1px solid var(--line);border-radius:14px;background:var(--bg2);color:var(--ink);max-width:720px;width:calc(100% - 32px);padding:18px"><form method="dialog" id="dlgForm"></form></dialog>

<script>
const KINDS = ["키비주얼", "포스터", "웹 배너", "SNS 카드", "리플렛", "부스 그래픽", "기타"];
const RATIO = {"키비주얼": "16:9", "포스터": "2:3", "웹 배너": "21:9", "SNS 카드": "4:5", "리플렛": "3:4", "부스 그래픽": "16:9", "기타": "1:1"};
const FLOW = ["접수", "레퍼런스", "추천", "키비주얼", "목업", "완료"];
const MG = "Magnific";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const http = u => /^https?:\/\//i.test(u || "") ? u : "";
const opt = (list, v, blank) => (blank !== undefined ? `<option value="">${blank}</option>` : "") + list.map(x => { const [k, l] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(k)}"${k === v ? " selected" : ""}>${esc(l)}</option>`; }).join("");
const today = () => new Date().toLocaleDateString("sv-SE", {timeZone: "Asia/Seoul"});
const dday = d => { if (!d) return ""; const n = Math.round((new Date(d) - new Date(today())) / 864e5); return n < 0 ? `D+${-n}` : n === 0 ? "D-DAY" : `D-${n}`; };
const srcOf = u => /pinterest|pin\.it/i.test(u) ? "Pinterest" : /behance/i.test(u) ? "Behance" : u ? "기타" : "업로드";

const applyTheme = m => { if (m === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = m;
  document.querySelectorAll("[data-theme-m]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeM === m)); try { localStorage.setItem("prism-theme", m); } catch {} };
let th = "system"; try { th = localStorage.getItem("prism-theme") || "system"; } catch {} applyTheme(th);

let db = null, sample = null, mcp = null, tab = "req", cur = null, rf = "진행", cfg = {};
let briefs = [], refs = [], rjobs = [], busy = {}, msg = {};
try { tab = localStorage.getItem("prism-tab") || "req"; cur = localStorage.getItem("prism-cur"); } catch {}
const B = () => briefs.find(b => b.id === cur);
const say = (id, m) => { msg[id] = m; if ($(id)) $(id).textContent = m; };
const askErr = e => ({no: "이 화면에서는 PRISM(Claude)에게 일을 맡길 수 없습니다. claude.ai에서 열어 주세요.", not_granted: "Claude 사용이 허용되지 않았습니다.", rate_limited: "요청이 많습니다. 잠시 후 다시 눌러 주세요."}[e?.code] || "PRISM이 답을 만들지 못했습니다. 다시 눌러 주세요.");
const mcpErr = e => ({needs_reauth: "연결이 만료되었습니다. claude.ai 설정 → 커넥터에서 다시 연결해 주세요.", server_not_connected: "커넥터가 연결돼 있지 않습니다. claude.ai 설정 → 커넥터에서 추가해 주세요.", not_in_manifest: "이 페이지에 허용되지 않은 도구입니다.", tool_error: "도구가 요청을 거절했습니다.", server_unavailable: "잠시 응답하지 않습니다. 잠시 후 다시 눌러 주세요."}[e?.code] || "작업에 실패했습니다" + (e?.message ? `: ${e.message}` : "."));
// 요청 문서는 바뀐 칸만 쓴다 — 생성이 몇 분 걸리는 동안 다른 사람이 고친 칸을 덮지 않게
async function put(id, f) { if (!db) return false; const L = latest(id); Object.assign(L, f); try { await db.doc(`briefs/${id}`).update({...f, updatedAt: new Date().toISOString()}); return true; } catch { return false; } }
const latest = id => briefs.find(b => b.id === id) || {};
const nextState = (id, s) => FLOW.indexOf(s) > stepOf(latest(id)) ? s : latest(id).상태 || "접수";
const addGens = (id, gens, s) => { const m = new Map((latest(id).시안 || []).map(g => [g.id, g])); gens.forEach(g => m.set(g.id, {...m.get(g.id), ...g})); return put(id, {시안: [...m.values()], 상태: nextState(id, s)}); };
const stepOf = b => Math.max(0, FLOW.indexOf(b.상태 || "접수"));

// ── 상단
function drawHero() {
  const live = briefs.filter(b => b.상태 !== "완료"), soon = live.filter(b => b.마감 && (new Date(b.마감) - new Date(today())) / 864e5 <= 3);
  $("kpis").innerHTML = [["진행 요청", live.length], ["3일 내 마감", soon.length], ["레퍼런스", refs.length]].map(([k, v]) => `<div class="kpi"><span class="hudlabel">${k}</span><b>${v}</b></div>`).join("");
  $("say").textContent = !db ? "이 화면에서는 저장소에 연결할 수 없습니다. claude.ai에서 열어 주세요." : !briefs.length ? "아직 디자인 요청이 없습니다. [+ 새 요청]으로 홍보물 종류·마감·톤을 적어 주세요." :
    `진행 중인 요청 ${live.length}건${soon.length ? `, 그중 ${soon.length}건이 3일 안에 마감입니다` : ""}. 레퍼런스 3개를 추천하고 키비주얼과 목업까지 이어서 만들겠습니다.`;
}
function showTab(t) { if (!["req", "ref", "work"].includes(t)) t = "req"; tab = t; try { localStorage.setItem("prism-tab", t); } catch {}
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  ["req", "ref", "work"].forEach(k => $("tab-" + k).hidden = k !== t); draw(); }
function draw() { drawHero(); if (tab === "req") drawReq(); if (tab === "ref") drawRef(); if (tab === "work") drawWork(); }

// ── 디자인 요청
function drawReq() {
  $("rFilt").innerHTML = [["진행", "진행 중"], ["완료", "완료"], ["", "전체"]].map(([k, l]) => `<button type="button" data-rf="${k}" aria-pressed="${rf === k}">${l}</button>`).join("");
  const rows = briefs.filter(b => !rf || (rf === "완료") === (b.상태 === "완료")).sort((a, b) => String(a.마감 || "9").localeCompare(String(b.마감 || "9")));
  $("reqList").innerHTML = rows.map(b => { const s = stepOf(b), dd = dday(b.마감), late = /^D\+/.test(dd) && b.상태 !== "완료";
    return `<article class="card click${b.id === cur ? " sel" : ""}" data-open="${esc(b.id)}"><div class="row"><h3 style="flex:1">${esc(b.제목)}</h3>${dd ? `<span class="tag ${late ? "stop" : /^D-[0-3]$|DAY/.test(dd) ? "amber" : ""}">${dd}</span>` : ""}</div>
      <div class="note">${esc([b.프로젝트, b.마감 && `마감 ${b.마감}`].filter(Boolean).join(" · "))}</div>
      <div class="chips">${(b.종류 || []).map(k => `<span class="tag">${esc(k)}</span>`).join("")}</div>
      <div class="flow">${FLOW.map((f, i) => `<span class="${i <= s ? "done" : ""}">${f}</span>`).join("")}</div>
      <div class="row"><button class="btn" type="button" data-edit="${esc(b.id)}">수정</button><button class="btn primary" type="button" data-go="${esc(b.id)}">시안 작업 →</button></div></article>`; }).join("") || '<p class="empty">요청이 없습니다.</p>';
}
function editBrief(b) {
  const isNew = !b; b = b || {id: "D" + Date.now().toString(36), 종류: ["키비주얼"], 상태: "접수"};
  $("dlgForm").innerHTML = `<h2 style="margin:0 0 12px">${isNew ? "새 디자인 요청" : esc(b.제목)}</h2><div class="form">
    <label class="wide">제목<input data-bf="제목" value="${esc(b.제목)}" placeholder="예) 2026 K-콘텐츠 마켓 공동관 키비주얼"></label>
    <label>프로젝트·행사<input data-bf="프로젝트" value="${esc(b.프로젝트)}"></label>
    <label>마감일<input type="date" data-bf="마감" value="${esc(b.마감)}"></label>
    <label>상태<select data-bf="상태">${opt(FLOW, b.상태 || "접수")}</select></label>
    <label class="wide">홍보물 종류<span class="chips">${KINDS.map(k => `<label><input type="checkbox" data-kind="${k}" ${(b.종류 || []).includes(k) ? "checked" : ""}>${k}</label>`).join("")}</span></label>
    <label class="wide">톤·키워드<input data-bf="톤" value="${esc(b.톤)}" placeholder="예) 미래적, 네온, 한국 전통 문양, 신뢰감"></label>
    <label class="wide">설명 (대상·필수 문구·로고·금지 사항)<textarea data-bf="설명">${esc(b.설명)}</textarea></label></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" value="save">저장</button>${isNew ? "" : '<button class="btn x" value="del">삭제</button>'}<button class="btn" value="cancel">닫기</button></div>`;
  $("dlg").onclose = async () => { const v = $("dlg").returnValue; if (!v || v === "cancel" || !db) return;

  say("mNote", "목업을 만들었습니다. 원본 링크에서 내려받거나 Magnific에서 이어서 편집할 수 있습니다."); busy.mk = false; drawWork();
}
async function runFind() {
  const b = B(); if (!db || !mcp) { say("fNote", "이 화면에서는 수집 작업을 시작할 수 없습니다."); return; }
  if (!cfg.trigger) { say("fNote", "레퍼런스 수집 작업이 아직 연결되지 않았습니다. JARVIS에게 연결을 요청해 주세요. 그동안은 직접 추가로 모을 수 있습니다."); return; }
  if (!confirm(`'${b.제목}' 레퍼런스를 웹에서 찾을까요? 10~20분 걸리고 본부장님 Claude 사용량이 쓰입니다.`)) return;
  if (busy.find) return; busy.find = true; setTimeout(() => { busy.find = false; }, 60e3); drawWork(); // 스냅샷이 오기 전 두 번 눌러 세션이 두 번 도는 것을 막는다
  const jid = "R" + Date.now().toString(36);
  try { await db.doc(`rjobs/${jid}`).set({bid: b.id, 제목: b.제목, status: "요청", at: new Date().toISOString()}); } catch { say("fNote", "작업을 저장하지 못했습니다."); return; }
  try { await mcp.callTool("Claude Code Remote", "fire_trigger", {trigger_id: cfg.trigger, text: `jobId: ${jid}`}); say("fNote", "수집을 시작했습니다. 찾는 대로 이 요청에 연결됩니다."); }
  catch (e) { if (e?.retryable) { say("fNote", "시작됐는지 확인이 안 됩니다. 몇 분 뒤 상태가 바뀌지 않으면 다시 눌러 주세요."); return; }
    say("fNote", mcpErr(e)); db.doc(`rjobs/${jid}`).update({status: "오류", 오류: "작업 세션을 시작하지 못함"}).catch(() => {}); }
}

// ── 이벤트
document.addEventListener("click", async e => {
  const t = e.target.closest("button, [data-open]"); if (!t) return;
  if (t.dataset.themeM) applyTheme(t.dataset.themeM);
  if (t.dataset.tab) showTab(t.dataset.tab);
  if (t.dataset.rf !== undefined) { rf = t.dataset.rf; drawReq(); }
  if (t.id === "newReq") editBrief(null);
  if (t.dataset.edit) { e.stopPropagation(); editBrief(briefs.find(b => b.id === t.dataset.edit)); return; }
  if (t.dataset.go) { e.stopPropagation(); cur = t.dataset.go; msg = {}; try { localStorage.setItem("prism-cur", cur); } catch {} showTab("work"); return; }
  if (t.dataset.open && t.tagName !== "BUTTON") { cur = t.dataset.open; try { localStorage.setItem("prism-cur", cur); } catch {} drawReq(); }
  if (t.id === "rfAdd") addRef();
  if (t.dataset.rdel && confirm("이 레퍼런스를 보관함에서 지울까요?")) db?.doc(`refs/${t.dataset.rdel}`).delete().catch(() => {});
  if (t.id === "rFind") runFind();
  if (t.id === "rPick") runPick();
  if (t.id === "kvGo") runKv();
  if (t.id === "mkGo") runMk();
  if (t.id === "kvWait") resume();
  if (t.dataset.kv) { await put(cur, {kv: {...(latest(cur).kv || {}), id: t.dataset.kv}}); drawWork(); }
  if (t.dataset.gdel) { const L = latest(cur), f = {시안: (L.시안 || []).filter(g => g.id !== t.dataset.gdel)}; if (L.kv?.id === t.dataset.gdel) f.kv = {...L.kv, id: ""}; await put(cur, f); drawWork(); }
  if (t.id === "done") { await put(cur, {상태: "완료"}); drawWork(); }
});
document.addEventListener("change", async e => { const t = e.target;
  if (t.id === "wReq") { cur = t.value; msg = {}; try { localStorage.setItem("prism-cur", cur); } catch {} drawWork(); }
  if (["rSrc", "rReq"].includes(t.id)) drawRef();
});
$("rq").addEventListener("input", drawRef);
document.addEventListener("error", e => { const t = e.target; if (t.tagName === "IMG" && t.closest(".ph")) t.remove(); }, true); // 미리보기를 못 불러오면 출처 글자만 남긴다

showTab(tab);
(async () => {
  [db, sample, mcp] = await Promise.all(["db", "sample", "mcp"].map(n => Promise.resolve(window.claude?.use?.(n)).catch(() => null).then(x => x ?? null)));
  if (!db) { drawHero(); return; }
  const busyDlg = () => $("dlg").open || ["kvP", "rfUrl", "rfImg", "rfTitle", "rfTags"].includes(document.activeElement?.id);
  db.collection("briefs").onSnapshot(s => { briefs = s.docs.map(d => ({id: d.id, ...d.data()})); if (!busyDlg()) draw(); else drawHero(); });
  db.collection("refs").onSnapshot(s => { refs = s.docs.map(d => ({id: d.id, ...d.data()})); if (!busyDlg()) draw(); else drawHero(); });
  db.collection("rjobs").onSnapshot(s => { rjobs = s.docs.map(d => ({id: d.id, ...d.data()})); if (tab === "work" && !busyDlg()) drawWork(); });
  db.doc("config/prism").onSnapshot(d => { cfg = d.exists ? d.data() : {}; });
})();
</script>
