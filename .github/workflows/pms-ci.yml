name: pms-ci

on:
  push:
    paths: ["pms/**", ".github/workflows/pms-ci.yml"]
  pull_request:
    paths: ["pms/**", ".github/workflows/pms-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pms
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pms/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: DB 마이그레이션·권한 테스트
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/pms_test
        run: ./db/test/run.sh
