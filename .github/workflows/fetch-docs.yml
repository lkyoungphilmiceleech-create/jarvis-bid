name: DECODER 첨부파일 수집

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'decoder/queue.json'
      - 'fetch_docs.py'

permissions:
  contents: write

concurrency:
  group: bid-collect
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install --quiet requests
      - name: Fetch attachments
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python fetch_docs.py
      - name: Commit results
        if: always()
        run: |
          git config user.name  "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add decoder/
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(decoder): 첨부파일 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi
